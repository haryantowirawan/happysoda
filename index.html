    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 500px at 50% -10%, #2c2115 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      padding: 28px 16px 60px;
    }
    .wrap { max-width: 900px; margin: 0 auto; }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 26px;
    }
    .logo {
      height: 140px;
      width: auto;
      margin-bottom: 6px;
      filter: drop-shadow(0 6px 18px rgba(238, 211, 182, 0.18));
    }
    .site-tagline {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 10px;
    }
    h1 {
      font-size: 22px;
      margin: 2px 0 6px;
      letter-spacing: 0.01em;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    h1 .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      flex-shrink: 0;
    }
    h1 .dot.error { background: #e0715c; box-shadow: 0 0 8px #e0715c; }
    .meta {
      color: var(--muted);
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 14px;
    }
    .meta span { margin: 0 7px; }

    .warnings {
      background: #332512;
      border: 1px solid #5c4620;
      color: #f0cf98;
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 13px;
      margin: 14px 0;
      line-height: 1.5;
    }
    .warnings strong { display: block; margin-bottom: 4px; }
    .warnings.fatal {
      background: #3a1f1a;
      border-color: #6b3327;
      color: #f0b3a4;
    }

    body.light-mode {
      --bg: #f2f5f1;
      --panel-solid: #ffffff;
      --panel-2: #eaf0eb;
      --border: #e1e8e2;
      --text: #17251d;
      --muted: #66756b;
      --accent: #0f5a3a;
      --accent-ink: #ffffff;
      --accent-soft: #dcefe2;
      --action: #b9560f;
      --action-ink: #ffffff;
      --bar: #a8d5b4;
      --tabs-bg: #e3ebe4;
      --info: #2c6c9c;
      --info-soft: #e0eaf7;
      --gold: #e0a100;
      --silver: #8a8f8b;
      --bronze: #a56a35;
      --green: #1f8a4c;
      --red: #c0392b;
      --red-soft: #fde4df;
      --orange: #d97706;
      --orange-soft: #fdebd3;
      --yellow-soft: #fdf6d3;
      --yellow-ink: #8a6d00;
      --shadow: 0 1px 2px rgba(16, 40, 28, 0.05), 0 6px 18px rgba(16, 40, 28, 0.06);
      background: var(--bg);
    }
    body.light-mode .warnings {
      background: #fff3d6;
      border-color: #e6c878;
      color: #7a5c12;
    }
    body.light-mode .warnings.fatal {
      background: #ffe8e3;
      border-color: #e3a99a;
      color: #a23c2a;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    #page-records .controls-row { margin-bottom: 18px; }
    .asat-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--muted);
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
    }
    .asat-input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12.5px;
      font-family: inherit;
    }
    .asat-input:focus { outline: none; }
    .theme-toggle {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      line-height: 1.4;
    }
    .theme-toggle:hover { border-color: var(--accent); }

    .tabs {
      display: flex;
      gap: 6px;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      margin: 18px 0 16px;
      overflow-x: auto;
    }
    .tab {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .tab.active {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .tab .count {
      opacity: 0.75;
      margin-left: 4px;
      font-weight: 500;
    }

    .dashboard-period {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 14px;
    }

    .search {
      width: 100%;
      padding: 11px 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-solid);
      color: var(--text);
      font-size: 14px;
      margin-bottom: 14px;
    }
    .search:focus {
      outline: none;
      border-color: var(--accent);
    }
    .search::placeholder { color: var(--muted); }

    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn 0.2s ease; }
    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: #fff;
      font-size: 14px;
      z-index: 100;
    }
    .loading-overlay.show { display: flex; }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tm-section { margin-bottom: 16px; }
    .tm-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .tm-textarea {
      width: 100%;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 10px;
      margin-bottom: 8px;
      resize: vertical;
    }
    .tm-unmatched-box {
      background: var(--panel-solid);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 14px;
      font-size: 12.5px;
    }
    .tm-unmatched-title {
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .tm-unmatched-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 0;
      border-top: 1px solid var(--border);
    }
    .tm-unmatched-row:first-child { border-top: none; }
    .tm-unmatched-name { font-weight: 600; color: var(--text); }
    .tm-pos-btns { display: flex; gap: 4px; flex-wrap: wrap; }
    .tm-pos-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .tm-pos-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tm-selection-header {
      margin-bottom: 12px;
    }
    .tm-selection-header span {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }
    .tm-selection-hint {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }
    .tm-assemble-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      color: var(--muted);
    }
    .tm-assemble-btn:disabled:hover { border-color: var(--border); }
    /* Primary-action tint — a deeper shade than --accent so Assemble Teams /
       Create League read as the primary action, distinct both from the
       neutral Export/Copy buttons below them and from a selected .tm-tile
       name box, which fills with --accent itself. */
    .tm-assemble-btn:not(:disabled) {
      background: var(--action);
      color: var(--action-ink);
      border-color: var(--action);
    }
    .tm-assemble-btn:not(:disabled):hover {
      opacity: 0.9;
      border-color: var(--action);
    }
    .tm-tile-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .tm-tile {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--panel-solid);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 6px;
      cursor: pointer;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .tm-tile-name {
      font-size: 14.5px;
      font-weight: 700;

    /* Every export image is a bordered, rounded card sitting on an opaque
       gutter. html2canvas crops to the captured element's exact border box,
       so a border on the capture root itself lands in the image's outermost
       pixel row/column and reads as no border at all (and the rounded
       corners come out transparent). So the card is always the inner
       .export-card, and the capture roots only become the gutter during a
       capture — nothing about the on-screen pages changes. */
    .export-card {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    body.exporting-records #recordsExportCapture,
    body.exporting-records #ldExportCapture,
    body.exporting-records #financeExportCapture {
      background: var(--bg);
      padding: 16px;
    }
    body.exporting-records .records-panel {
      display: block !important;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    /* During export only, flow the sections into 3 balanced columns
       instead of stacking them — this uses the horizontal space that was
       going unused and cuts the image's height a long way, which helps a
       lot with WhatsApp's compression: very tall, extreme-aspect-ratio
       images get hit hardest by it.
       This is a multi-column flow, not a grid, on purpose. A 2-column
       grid pairs the sections off row by row, so every row was as tall as
       its taller section — a 21-name membership list beside a 6-name Week
       1 left ~15 rows of dead space, and an unused Week 5 wasted half a
       row. Columns instead pack the sections continuously and the browser
       balances the column heights itself, so the gaps disappear whatever
       shape the month happens to be. */
    body.exporting-records #recordsExportCapture .export-card {
      columns: 3;
      column-gap: 14px;
    }
    body.exporting-records #recordsExportTitle {
      column-span: all;
    }
    body.exporting-records #recordsExportCapture .records-panel {
      break-inside: avoid;
      margin-bottom: 14px;
      padding-bottom: 0;
      border-bottom: none;
      min-width: 0;
    }
    body.exporting-records #recordsExportCapture .records-panel[data-empty] {
      display: none !important;
    }
    .records-panel[data-export-label]::before {
      content: attr(data-export-label);
      display: block;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 8px;
      color: var(--accent);
    }

    /* League Draft's export gets the same "2-column grid + widen during
       capture" treatment as Monthly Records, for the same reason — with
       4+ teams stacked vertically, the image gets tall enough to trigger
       WhatsApp's more aggressive compression. */
    body.exporting-records #ldExportCapture .export-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
    }
    body.exporting-records #ldExportCapture .records-export-title,
    body.exporting-records #ldExportCapture .tm-fairness-note {
      grid-column: 1 / -1;
    }
    body.exporting-records #ldExportCapture .tm-team-card { margin-bottom: 0; }
    /* Type sizes for the exported image. The layout above stays 2-column
       at the full capture width on purpose — a single narrow column reads
       bigger on a phone, but the resulting tall image is exactly what
       WhatsApp's resize hits hardest, so the size comes from the type
       instead. What matters for legibility is font size RELATIVE to image
       width, since a phone scales the whole PNG to fit the screen: the
       original 15px inside a 732px-wide image landed at roughly 8px on a
       390px screen, and 23px lands at ~12px without changing the image's
       shape. Sizes stop here because the "N players · Total rating …" line
       starts wrapping in a half-width card past this. */
    body.exporting-records #ldExportCapture .tm-team-player {
      font-size: 23px;
      padding: 9px 0;
    }
    body.exporting-records #ldExportCapture .ld-jersey { font-size: 16px; min-width: 32px; }
    body.exporting-records #ldExportCapture .tm-team-player-pos { font-size: 19px; }
    body.exporting-records #ldExportCapture .tm-team-title { font-size: 24px; }
    body.exporting-records #ldExportCapture .tm-team-rating { font-size: 16px; }
    body.exporting-records #ldExportCapture .tm-fairness-note { font-size: 17px; }
    body.exporting-records #ldExportCapture .records-export-title { font-size: 23px; }

    /* Fixed column widths so Name/Fee line up identically across every
       tab — without this, each table's columns auto-size to their own
       content, making the Fee column visibly jump left/right when
       switching tabs. */
    .records-data-table { table-layout: fixed; width: 100%; }
    .records-data-table th:nth-child(1), .records-data-table td:nth-child(1) { width: 10%; }
    .records-data-table th:nth-child(2), .records-data-table td:nth-child(2) { width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .records-data-table th:nth-child(3), .records-data-table td:nth-child(3) { width: 48%; text-align: right; white-space: nowrap; }
    /* Sizing for the exported image's 3 columns — narrower than the
       on-screen tab, so the padding tightens and the Name column gives up

    body.exporting-records .records-data-table { font-size: 13.5px; }
    body.exporting-records .records-data-table th,

    .card-points .num.amount-credit { color: var(--green); }
    /* A currency amount is a long string, not a 2-digit point count — left at
       the .num size (20px/800) it dwarfs the 15px name beside it, so the two
       fee lists size their amount to sit with the name instead. */
    .card-points .num.amount-owed,
    .card-points .num.amount-credit {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }
    /* These cards are a single line (no reason/label under either side), so the
       name's second-line spacing would just push it off-center from the fee. */
    .balance-card .card-name { margin-bottom: 0; }
    .card-points .label {
      font-size: 10.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 40px 20px;
      font-size: 14px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
    .table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel-solid); }
    .yes { color: var(--green); font-weight: 700; }
    .no { color: var(--muted); }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 30px;
      line-height: 1.6;
    }

    /* First-load progress bar, shown inside #content until the initial
       loadData() resolves — see the matching #initialLoadOverlay in
       ../app-script-backend/ui.html (mirrored here per that repo's
       CLAUDE.md, since this isn't shared-logic-mechanism code). Unlike
       ui.html's version this isn't full-screen: the header/logo already
       render immediately since this is a static page, only #content
       itself was showing a placeholder. */
    .initial-load-progress {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 60px 20px;
    }
    .initial-progress-track {
      width: 220px;
      height: 6px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .initial-progress-fill {
      height: 100%;
      width: 4%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.4s ease;
    }
    .initial-load-text {
      color: var(--muted);
      font-size: 13px;
    }

    /* ===================== GREEN THEME =====================
       Re-theme after the "Happy Soda" green mockup: full-bleed hero banner,
       icon side rail, card/pill styling, and a Dashboard player list that
       stays within the viewport with its search/tabs/heading pinned above
       it. Appended last so it overrides the base rules above by cascade
       order. Mirrored byte-for-byte between app-script-backend/ui.html and
       web-frontend/index.html. */
    body, body.light-mode {
      background: var(--bg);
      padding: 0 0 60px;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap {
      max-width: 980px;
      padding: 0 16px 0 88px;
    }
    @media (min-width: 1220px) {
      .wrap { padding-left: 16px; }
    }
    .icon {
      width: 1em;
      height: 1em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ---- Hero banner ---- */
    header.hero {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      /* Equal side padding keeps the wordmark centered on the page; the
         rail no longer overlaps the banner (see --rail-top below). */
      padding: 30px 104px 40px;
      margin: 0 0 22px;
      color: #ffffff;
      text-align: left;
      /* Photo is hosted by web-frontend (images/header-bg.jpg); ui.html
         loads it cross-origin, which a CSS background needs no CORS for. */
      background:
        linear-gradient(180deg, rgba(4, 18, 12, 0.30) 0%, rgba(4, 18, 12, 0.55) 100%),
        url("https://happysoda.pages.dev/images/header-bg.jpg") center 55% / cover no-repeat,
        #0c3424;
      border-radius: 0 0 50% 50% / 0 0 34px 34px;
    }
    .hero-left {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.22em;
      line-height: 1.75;
      text-transform: uppercase;
    }
    .hero-left::after {
      content: "";
      display: block;
      width: 60px;
      height: 3px;
      margin-top: 6px;
      border-radius: 3px;
      background: #4cc38a;
      transform: rotate(-4deg);
    }
    .hero-center {
      text-align: center;
      /* On the wrapper, not the title: a filter on the masked element
         itself would be masked away along with everything else. */
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.45));
    }
    /* The original hand-lettered "Happy Soda" logo artwork, used as a mask
       so it can take any color (white here) instead of a lookalike font. */
    .hero-title {
      width: 230px;
      height: 175px;
      margin: 0 auto;
      background: #ffffff;
      -webkit-mask: var(--logo-mask) center / contain no-repeat;
      mask: var(--logo-mask) center / contain no-repeat;
    }
    .hero-sub {
      margin-top: 10px;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .hero-right {
      justify-self: end;
      font-family: "Kaushan Script", cursive;
      font-size: 19px;
      line-height: 1.15;
      text-align: right;
      transform: rotate(-9deg);
    }
    @media (max-width: 720px) {
      header.hero {
        grid-template-columns: 1fr;
        padding: 64px 20px 34px;
        background-position: center, 72% 55%, center;
      }
      .hero-left, .hero-right { display: none; }
      .hero-title { width: 180px; height: 137px; }
      .hero-sub { font-size: 10.5px; letter-spacing: 0.16em; margin-top: 12px; }
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 12px;
      margin: 0 0 14px;
    }
    .page-head h1 { font-size: 20px; font-weight: 800; margin: 0; }
    .page-head .meta { font-size: 12px; justify-content: flex-end; }
    .page-head .meta span { margin: 0; }

    /* ---- Side rail: icons only; the hamburger expands it with labels ---- */
    .hamburger-btn {
      position: absolute;
      top: 18px;
      left: 16px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .hamburger-btn span { background: #ffffff; }
    .side-menu {
      top: 50%;
      left: 12px;
      height: auto;
      width: 62px;
      max-width: none;
      max-height: calc(100vh - 24px);
      max-height: calc(100dvh - 24px);
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
      padding: 12px 8px;
      gap: 4px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 28px rgba(15, 40, 28, 0.10);
      transform: translateY(-50%);
      transition: width 0.22s ease, box-shadow 0.22s ease;
    }
    .side-menu.open {
      transform: translateY(-50%);
      width: 228px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
    }
    /* HS monogram artwork, masked so it follows the theme's accent color. */
    .side-menu-brand {
      flex-shrink: 0;
      width: 40px;
      height: 30px;
      margin: 2px 0 10px 2px;
      background: var(--accent);
      -webkit-mask: var(--hs-mask) center / contain no-repeat;
      mask: var(--hs-mask) center / contain no-repeat;
    }
    .side-menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    .side-menu-item:hover { background: var(--panel-2); color: var(--text); }
    .side-menu-item.active { background: var(--accent-soft); color: var(--accent); }
    .smi-icon { display: flex; font-size: 21px; }
    .smi-label { opacity: 0; transition: opacity 0.15s ease; }
    .side-menu.open .smi-label { opacity: 1; }
    .side-menu-divider { margin: 6px; }
    @media (max-width: 520px) {
      .wrap { padding: 0 12px 0 66px; }
      .side-menu { left: 6px; width: 52px; padding: 10px 5px; }
      .side-menu-item { padding: 9px 10px; }
      .smi-icon { font-size: 20px; }
    }

    /* ---- Shared card surfaces ---- */
    .card,
    .trend-chart-wrap,
    .delta-box,
    .delta-group,
    .about-card,
    .tm-team-card,
    .il-league-block,
    .ld-roster-summary,
    .table-scroll {
      box-shadow: var(--shadow);
    }
    .card:hover { border-color: var(--bar); }
    body.light-mode .badge.hybrid { background: #dcefe2; color: #17613d; }
    body.light-mode .badge.loyal { background: #e2e7f7; color: #34458a; }

    /* ---- Dashboard: month picker + period ---- */
    .dash-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .dash-toolbar .dashboard-period { margin: 0; font-size: 13.5px; }
    .month-pill {
      gap: 10px;
      padding: 9px 16px;
      color: var(--accent);
      font-size: 18px;
      box-shadow: var(--shadow);
    }
    .month-pill { position: relative; cursor: pointer; }
    .month-pill .asat-input { font-size: 15px; font-weight: 600; cursor: pointer; }

    /* ---- Dashboard: attendance chart ---- */
    .trend-chart-wrap { padding: 18px 18px 12px; }
    .chart-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }
    .chart-icon { display: flex; color: var(--accent); font-size: 28px; }
    .chart-titles { flex: 1; min-width: 0; }
    .trend-chart-wrap .trend-chart-title {
      padding: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: none;
      color: var(--text);
    }
    .chart-sub { margin-top: 2px; font-size: 13px; color: var(--muted); }
    .trend-badge {
      flex-shrink: 0;
      padding: 6px 12px;
      background: var(--accent-soft);
      text-align: center;
    }
    .trend-badge-num {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
    }
    .trend-badge.down { background: var(--red-soft); }
    .trend-badge.down .trend-badge-num { color: var(--red); }
    .trend-badge.flat { background: var(--yellow-soft); }
    .trend-badge.flat .trend-badge-num { color: var(--yellow-ink); }
    .trend-badge-sub { font-size: 11px; color: var(--muted); }
    .trend-chart { height: 170px; gap: 10px; }
    .trend-bar {
      max-width: 48px;
      background: var(--bar);
    }
    .trend-bar-col.current .trend-bar { background: var(--accent); }
    .trend-bar-value { margin-bottom: 5px; font-size: 13px; font-weight: 700; color: var(--text); }
    .trend-bar-label { margin-top: 7px; font-size: 12px; }
    @media (max-width: 520px) {
      .trend-chart { height: 140px; gap: 3px; }
      .trend-chart-wrap .trend-chart-title { font-size: 15px; }
      .chart-icon { font-size: 22px; }
      .chart-sub { font-size: 12px; }
      .trend-badge { padding: 5px 8px; }
      .trend-badge-num { font-size: 13px; }
      .trend-bar-value { font-size: 10.5px; }
      .trend-bar-label { font-size: 10px; }
    }

    /* ---- Dashboard: new/returning + member changes ---- */
    .delta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 720px) {
      .delta-row { grid-template-columns: 1fr; }
    }
    .delta-box, .delta-group { padding: 16px 18px; }
    .delta-box.newcomer .delta-label,
    .delta-group-title {
      margin-bottom: 10px;
      font-size: 15.5px;
      letter-spacing: 0;
      text-transform: none;
    }
    .delta-box.newcomer .delta-label { color: var(--accent); }
    .delta-group-title { color: var(--text); }
    .delta-names { font-size: 15px; line-height: 1.55; }
    .delta-group-row { gap: 10px; }
    .delta-subbox { padding: 10px 12px; }
    .delta-subbox.comeback { background: var(--accent-soft); }
    .delta-subbox.departed { background: var(--orange-soft); }
    .delta-subbox.comeback .delta-label { color: var(--accent); }
    .delta-subbox.departed .delta-label { color: var(--orange); }

    /* ---- Dashboard: player list ----
       The section is capped at the viewport height and only the list body
       scrolls, so the search box, tier tabs and list heading stay in view
       while scrolling through players. Scroll chaining is left on, so once
       the list hits its end the page itself carries on to the footer. */
    .players-section {
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 20px);
      max-height: calc(100dvh - 20px);
      margin-top: 14px;
    }
    .players-head { flex-shrink: 0; }
    .players-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 2px;
    }
    .players-scroll .table-scroll { overflow: visible; }
    .players-scroll thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--panel-solid);
    }
    .search-wrap { position: relative; margin-bottom: 12px; }
    /* Direct child only: the magnifier. The clear button's own icon is
       nested inside the button and must not be absolutely positioned. */
    .search-wrap > [data-icon] .icon {
      position: absolute;
      left: 17px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: var(--muted);
      pointer-events: none;
    }
    .search-wrap .search {
      margin-bottom: 0;
      padding: 13px 18px 13px 46px;
      font-size: 15px;
      font-family: inherit;
      box-shadow: var(--shadow);
    }
    .tabs {
      gap: 6px;
      padding: 5px;
      margin: 0 0 14px;
      border: none;
      background: var(--panel-2);
      scrollbar-width: none;
    }
    .tab {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      color: var(--text);
      background: var(--panel-solid);
    }
    .tab .count { margin-left: 8px; }
    .list-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 2px 0 12px;
    }
    .list-heading-icon { display: flex; font-size: 30px; color: var(--gold); }
    .list-title { font-size: 20px; font-weight: 800; }
    .list-sub { font-size: 13px; color: var(--muted); }

    .card { gap: 14px; padding: 12px 16px; margin-bottom: 8px; }
    .rank,
    .rank.top1,
    .rank.top2,
    .rank.top3 {
      width: 22px;
      font-size: 17px;
      font-weight: 600;
      color: var(--orange);
    }
    .avatar {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      margin-top: 6px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: 600;
    }
    .avatar-crown {
      position: absolute;
      top: -13px;
      left: 50%;
      display: flex;
      font-size: 18px;
      color: var(--gold);
      transform: translateX(-50%);
    }
    .avatar-crown .icon { fill: currentColor; stroke: none; }
    .avatar.tone-0 { background: #1d3b2c; color: #8fe0b4; }
    .avatar.tone-1 { background: #1d3040; color: #9cc8ef; }
    .avatar.tone-2 { background: #3d2a1f; color: #f3b58f; }
    .avatar.tone-3 { background: #2d2745; color: #bcb0f0; }
    .avatar.tone-4 { background: #3f2229; color: #f0a5b4; }
    .avatar.tone-5 { background: #2a302b; color: #c3cbc4; }
    body.light-mode .avatar.tone-0 { background: #dcefe2; color: #17613d; }
    body.light-mode .avatar.tone-1 { background: #dde9f6; color: #1f4f7a; }
    body.light-mode .avatar.tone-2 { background: #fbe3d6; color: #a3481b; }
    body.light-mode .avatar.tone-3 { background: #e6e1f7; color: #4b3d8f; }
    body.light-mode .avatar.tone-4 { background: #f6dfe3; color: #8f2f45; }
    body.light-mode .avatar.tone-5 { background: #e7eae5; color: #3d463f; }
    .card-name { font-size: 16px; }
    .card-reason { font-size: 13px; line-height: 1.35; }
    .card-points .num { font-size: 24px; color: var(--orange); }
    .card-points .label { font-size: 11px; }
    @media (max-width: 520px) {
      .card { gap: 10px; padding: 12px; }
      .avatar { width: 40px; height: 40px; font-size: 14px; }
      .rank, .rank.top1, .rank.top2, .rank.top3 { width: 16px; font-size: 15px; }
      .card-name { font-size: 15px; }
      .card-reason { font-size: 12px; }
      .card-points .num { font-size: 20px; }
    }

    /* ---- Corner radii ----
       One restrained scale for every box and control: --radius (10px) for
       panels and cards, --radius-sm (7px) for buttons, inputs and inner
       boxes, 5px for small chips. Circles (avatars, status dot, spinner) and
       the thin progress bar stay fully round. */
    .warnings,
    .card,
    .trend-chart-wrap,
    .delta-box,
    .delta-group,
    .about-card,
    .tm-team-card,
    .tm-unmatched-box,
    .il-league-block,
    .ld-roster-summary,
    .ld-validation-ok,
    .ld-validation-error,
    .export-card,
    .table-scroll,
    .tabs {
      border-radius: var(--radius);
    }
    .export-btn,
    .asat-label,
    .month-pill,
    .theme-toggle,
    .search,
    .search-wrap .search,
    .tm-textarea,
    .tm-tile,
    .hamburger-btn,
    .side-menu-item,
    .about-photo,
    .il-winner-banner,
    .il-add-game-box,
    .il-archive-item summary,
    .delta-subbox,
    .trend-badge {
      border-radius: var(--radius-sm);
    }
    .tab { border-radius: 5px; }
    .side-menu { border-radius: 12px; }
    .badge,
    .il-status-badge,
    .tm-pos-btn,
    .il-form-grid input,
    .il-form-grid select,
    .il-rename-wrap input {
      border-radius: 5px;
    }
    .trend-bar { border-radius: 4px 4px 0 0; }

    /* ---- "More players below" cue ----
       Only the list body scrolls, and phones hide scrollbars, so a list that
       continues below could pass for a short one. While there's more below,
       the bottom edge fades out and a "More players" button shows; both go
       away once the list is scrolled to its end. */
    .players-section { position: relative; }
    .players-section::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 72px;
      background: linear-gradient(to bottom, transparent, var(--bg));
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .players-section.has-more::after { opacity: 1; }
    .scroll-more {
      position: absolute;
      left: 50%;
      bottom: 10px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: var(--accent-ink);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .players-section.has-more .scroll-more {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }
    .scroll-more .icon { font-size: 16px; animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(2px); }
    }
    .players-scroll { scrollbar-width: thin; scrollbar-color: var(--bar) transparent; }
    .players-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .players-scroll::-webkit-scrollbar-thumb { background: var(--bar); border-radius: 4px; }

    /* ---- Month pickers ----
       <select>s rather than <input type="month">: the native control renders
       as segmented fields with its own picker button, which looked dated
       beside the rest of the page. Options come from fillMonthSelect_(). */
    .month-select {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 0 2px 0 0;
      cursor: pointer;
    }
    .month-select:focus { outline: none; }
    .pill-chevron { display: flex; font-size: 16px; color: var(--muted); }
    .asat-label { gap: 8px; }

    /* ---- Tier/records tab strip ----
       The strip was var(--panel-2), barely distinguishable from the page, so
       the white inactive tabs had nothing to sit on. */
    .tabs {
      background: var(--tabs-bg);
      border: 1px solid var(--border);
    }
    .tab { border: 1px solid var(--border); }
    .tab.active { border-color: var(--accent); }

    /* ---- New/Returning + Member-change boxes as links into All Players ---- */
    .delta-label { display: flex; align-items: center; gap: 6px; }
    .delta-chevron {
      display: flex;
      margin-left: auto;
      font-size: 17px;
      color: var(--muted);
      transition: transform 0.15s ease;
    }
    .delta-link { cursor: pointer; }
    .delta-link:hover .delta-chevron,
    .delta-link:focus-visible .delta-chevron { transform: translateX(2px); }
    .delta-box.delta-link:hover, .delta-group .delta-link:hover { border-color: var(--accent); }
    .delta-subbox.delta-link { border: 1px solid transparent; }
    .delta-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---- Side rail placement ----
       Desktop: sits just below the banner and only pins near the top edge
       once the banner has scrolled away, so it never covers the header
       (--rail-top is maintained by updateRailOffset_).
       Phones: hidden entirely and opened as a drawer by the hamburger, which
       is where the space is worth saving. */
    .side-menu {
      top: var(--rail-top, 12px);
      transform: none;
      max-height: calc(100dvh - var(--rail-top, 12px) - 12px);
    }
    .side-menu.open { transform: none; }
    @media (max-width: 720px) {
      .wrap { padding: 0 14px; }
      .side-menu,
      .side-menu.open {
        top: 0;
        left: 0;
        height: 100%;
        max-height: none;
        width: 244px;
        padding: 72px 12px 20px;
        border-radius: 0 14px 14px 0;
        transform: translateX(-102%);
        transition: transform 0.25s ease;
      }
      .side-menu.open { transform: translateX(0); }
      .side-menu .smi-label { opacity: 1; }
      .side-menu-brand { margin-bottom: 14px; }
      /* Fixed, so the menu is still reachable once the banner is scrolled
         past — there's no rail on phones to fall back on. */
      .hamburger-btn {
        position: fixed;
        background: rgba(10, 30, 21, 0.55);
        border-color: rgba(255, 255, 255, 0.22);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
    }

    /* ---- Search clear button ----
       Shown only while the box has text (.search-wrap.has-text). Matters most
       for the New/Departed box links, which fill the box with several names at
       once — clearing that by hand is tedious. Escape clears it too. */
    .search-wrap .search { padding-right: 46px; }
    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 15px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%);
      transition: opacity 0.15s ease, color 0.15s ease;
    }
    .search-wrap.has-text .search-clear { opacity: 1; pointer-events: auto; }
    .search-clear:hover { color: var(--text); }
    .search-clear > span { display: flex; }

    /* ---- 12-month window chip ----
       The period used to be a bare line of text beside the month picker,
       which read as stray text and didn't say what the dates meant. */
    .period-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--panel-solid);
      box-shadow: var(--shadow);
    }
    .period-icon { display: flex; font-size: 18px; color: var(--accent); }
    .period-chip-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .dash-toolbar .dashboard-period {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      text-align: left;
    }

    /* Tinted like the active tab/rail item, so the chip reads as the period
       currently selected rather than a static note. */
    .period-chip {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: none;
    }
    .period-chip-label { color: var(--accent); opacity: 0.85; }
    .dash-toolbar .dashboard-period { color: var(--accent); font-weight: 700; }

    /* ---- New & Returning names get the same tinted box as New/Departed ---- */
    .delta-names-box {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
    }
    /* People icon beside "Member/Regular Changes", matching the chart header's
       icon treatment. */
    .delta-group-title { display: flex; align-items: center; gap: 8px; }
    .delta-title-icon { display: flex; font-size: 20px; color: var(--accent); }

    /* New & Returning is its own thing (first-timers and players back after a
       gap), not a Member/Regular change — so its box gets a soft blue rather
       than reusing the green the "New" box uses. */
    .delta-names-box { background: var(--info-soft); }
    .delta-box.newcomer .delta-label { color: var(--info); }
    /* Monthly Records' picker sits left, like the Dashboard's. */
    #page-records .controls-row { justify-content: flex-start; }
  </style>
</head>
<body class="light-mode">
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div id="loadingOverlayText">Loading…</div>
  </div>
  <header class="hero">
    <div class="hero-left">Play<br>Connect<br>Improve<br>Together</div>
    <div class="hero-center">
      <div class="hero-title" role="img" aria-label="Happy Soda"></div>
      <div class="hero-sub">Basketball Community &bull; Makassar</div>
    </div>
    <div class="hero-right">For The Love<br>of The Game</div>
  </header>
  <div class="wrap">
    <div class="page-head">
      <h1><span class="dot" id="statusDot"></span><span id="pageTitle">Loyalty Board</span></h1>
      <div class="meta"><span id="updatedLabel"></span></div>
    </div>

    <div id="warningsBox"></div>

    <div id="content">
      <div class="initial-load-progress">
        <div class="initial-progress-track"><div id="initialProgressFill" class="initial-progress-fill"></div></div>
        <div id="initialLoadText" class="initial-load-text">Loading the latest player data…</div>
      </div>
    </div>

    <footer id="footerLabel"></footer>
    <footer id="copyrightLabel" class="copyright"></footer>
  </div>

  <script>
    // ===================== CONFIGURATION =====================
    // Paste your Apps Script Web App URL here, ending in /exec
    // (same URL you'd normally share with players).
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzkY97F_zyPptOZvJrTsWlslDvE8mWA4iiSL0IRj_ajZo6Tez13iDY7lla3gTPIHv2c/exec';
    // ===========================================================

    let DATA = null;
    // Tracks whichever page is currently visible, so a rebuild triggered
    // by a month-picker change (via loadData -> buildDashboard) can
    // restore the same page instead of always landing back on Dashboard.
    let currentPage = 'dashboard';

    const PAGE_TITLES = {
      dashboard: 'Loyalty Board',
      outstanding: 'Outstanding Payments',
      credits: 'Player Credits',
      records: 'Monthly Records',
      teammanager: 'Team Manager',
      leaguedraft: 'League Draft',
      internalleagues: 'Internal Leagues',
      about: 'About Us',
    };

    // Switches the visible page without a full buildDashboard() rebuild —
    // a plain DOM class toggle, same mechanism app-script-backend's
    // ui.html uses (activatePage there). Used by the side-menu click
    // handler, by buildDashboard()'s own tail (to restore whichever page
    // was active before a rebuild), and by the Internal Leagues write
    // flows to jump to that page without reloading the whole dashboard.
    function activatePage(pageKey) {
      document.querySelectorAll('.side-menu-item[data-page]').forEach(function (t) {
        t.classList.toggle('active', t.dataset.page === pageKey);
      });
      document.querySelectorAll('.page').forEach(function (p) {
        p.classList.toggle('active', p.id === 'page-' + pageKey);
      });
      document.getElementById('pageTitle').textContent = PAGE_TITLES[pageKey] || 'Loyalty Board';
      currentPage = pageKey;
    }

    // Team Manager state — kept at top level (not reset by buildDashboard)
    // so an in-progress team-picking session survives the 15-minute
    // auto-refresh rebuild instead of silently losing selections.
    let tmMatched = [];
    let tmUnmatchedNames = [];
    let tmSelected = new Set();
    let tmLastResult = null;

    // League Draft state — same top-level persistence rationale as above.
    let ldMatched = [];
    let ldUnmatchedNames = [];
    let ldLastResult = null;
    let ldNumTeamsValue = 4;

    // Inline SVG icons (Lucide-style strokes) for the side rail and the
    // Dashboard's headings. Inline rather than an icon font/CDN so the Apps
    // Script iframe and html2canvas exports render them with no extra
    // requests. A path string can carry its own fill/stroke attributes.
    const ICON_PATHS = {
      home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
      card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
      coins: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
      calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
      users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
      shuffle: '<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
      trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2z"/>',
      trophyFill: '<path fill="currentColor" stroke="none" d="M6 2h12v7a6 6 0 0 1-5 5.9V18h3a2 2 0 0 1 2 2v2H6v-2a2 2 0 0 1 2-2h3v-3.1A6 6 0 0 1 6 9zM4 4h2v5H4.5a2.5 2.5 0 0 1 0-5zm16 0a2.5 2.5 0 0 1 0 5H18V4z"/>',
      info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
      lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
      unlock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
      moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
      search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
      bars: '<g fill="currentColor" stroke="none"><rect x="3" y="12" width="4.5" height="9" rx="1"/><rect x="9.75" y="7" width="4.5" height="14" rx="1"/><rect x="16.5" y="3" width="4.5" height="18" rx="1"/></g>',
      crown: '<path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>',
      trendUp: '<path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',
      trendDown: '<path d="M22 17l-8.5-8.5-5 5L2 7"/><path d="M16 17h6v-6"/>',
      trendFlat: '<path d="M3 12h18M16 7l5 5-5 5"/>',
      chevronDown: '<path d="m6 9 6 6 6-6"/>',
      chevronRight: '<path d="m9 18 6-6-6-6"/>',
      close: '<path d="M18 6 6 18M6 6l12 12"/>',
      history: '<path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-6.36 2.64L3 8"/><path d="M3 3v5h5"/>',
    };
    function icon_(name) {
      return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">' + (ICON_PATHS[name] || '') + '</svg>';
    }
    // Fills every [data-icon] placeholder in static/built markup.
    function hydrateIcons_(root) {
      (root || document).querySelectorAll('[data-icon]').forEach(function (el) {
        el.innerHTML = icon_(el.dataset.icon);
      });
    }
    function setMenuItemLabel_(btn, iconName, label) {
      btn.innerHTML = '<span class="smi-icon">' + icon_(iconName) + '</span><span class="smi-label">' + label + '</span>';
      btn.title = label;
    }
    // The Dashboard list heading follows whichever tier tab is active.
    function setListHeading_(tab) {
      document.getElementById('listTitle').textContent = tab.dataset.title || '';
      document.getElementById('listSub').textContent = tab.dataset.sub || '';
      document.getElementById('playersScroll').scrollTop = 0;
      updatePlayersScrollCue_();
    }

    // Toggles the "more players below" cue (see .players-section.has-more).
    function updatePlayersScrollCue_() {
      const el = document.getElementById('playersScroll');
      if (!el) return;
      const more = el.scrollHeight - el.scrollTop - el.clientHeight > 4;
      el.parentNode.classList.toggle('has-more', more);
    }
    let playersScrollResizeBound_ = false;
    function initPlayersScrollCue_() {
      const el = document.getElementById('playersScroll');
      el.addEventListener('scroll', updatePlayersScrollCue_, { passive: true });
      document.getElementById('scrollMoreBtn').addEventListener('click', function () {
        el.scrollBy({ top: Math.round(el.clientHeight * 0.8), behavior: 'smooth' });
      });
      if (!playersScrollResizeBound_) {
        playersScrollResizeBound_ = true;
        window.addEventListener('resize', updatePlayersScrollCue_);
      }
      updatePlayersScrollCue_();
    }

    // A filter containing commas means "any of these names" — the
    // New/Returning and Member-change boxes link into All Players with
    // several names at once.
    // Keeps the clear button in sync with the search box's contents; the box
    // is also filled programmatically (see showPlayersFiltered_), so this is
    // called from there too, not just on input.
    function updateSearchClear_() {
      const search = document.getElementById('searchBox');
      if (!search) return;
      search.parentNode.classList.toggle('has-text', search.value.length > 0);
    }

    function matchesFilter_(name, filter) {
      if (!filter) return true;
      const lower = String(name).toLowerCase();
      return filter.split(',')
        .map(function (t) { return t.trim(); })
        .filter(Boolean)
        .some(function (t) { return lower.indexOf(t) !== -1; });
    }

    // Month pickers list the last 36 months (plus the selected month, if a
    // ?month= param puts it outside that range). Values stay 'YYYY-MM', so
    // every reader of these controls is unchanged.
    function fillMonthSelect_(select, selected) {
      if (!select) return;
      const months = [];
      const now = new Date();
      let y = now.getFullYear();
      let m = now.getMonth() + 1;
      for (let i = 0; i < 36; i++) {
        months.push(y + '-' + String(m).padStart(2, '0'));
        m--;
        if (m === 0) { m = 12; y--; }
      }
      if (selected && months.indexOf(selected) === -1) months.unshift(selected);
      select.innerHTML = months.map(function (ym) {
        return '<option value="' + ym + '">' + formatMonthSeptStyle(ym) + '</option>';
      }).join('');
      select.value = selected || months[0];
    }

    // Keeps the desktop rail below the banner until the banner scrolls away.
    let railOffsetBound_ = false;
    function updateRailOffset_() {
      const hero = document.querySelector('header.hero');
      const menu = document.getElementById('sideMenu');
      if (!hero || !menu) return;
      menu.style.setProperty('--rail-top', Math.max(12, Math.round(hero.getBoundingClientRect().bottom + 12)) + 'px');
    }
    function initRailOffset_() {
      updateRailOffset_();
      if (railOffsetBound_) return;
      railOffsetBound_ = true;
      window.addEventListener('scroll', updateRailOffset_, { passive: true });
      window.addEventListener('resize', updateRailOffset_);
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function rankClass(i) {
      if (i === 0) return 'rank top1';
      if (i === 1) return 'rank top2';
      if (i === 2) return 'rank top3';
      return 'rank';
    }

    // Dashboard player rows: an initials avatar (tone picked by a stable
    // name hash, so a player keeps their color across reloads), a crown for
    // Member-tier players, and a two-line summary pulled out of the
    // backend's long points-formula reason string — the full string stays
    // available as the row's tooltip.
    function playerAvatar_(name, crowned) {
      const trimmed = String(name).trim();
      const words = trimmed.split(/\s+/).filter(Boolean);
      const initials = words.length > 1 ? words[0][0] + words[1][0] : trimmed.slice(0, 2);
      let hash = 0;
      for (let i = 0; i < trimmed.length; i++) hash = (hash * 31 + trimmed.charCodeAt(i)) >>> 0;
      return '<div class="avatar tone-' + (hash % 6) + '">' +
        (crowned ? '<span class="avatar-crown">' + icon_('crown') + '</span>' : '') +
        esc(initials.toUpperCase()) +
      '</div>';
    }

    function reasonSummary_(reason) {
      const months = /(\d+) active months?/.exec(reason || '');
      const visits = /(\d+) weekly-equivalent visits/.exec(reason || '');
      if (!months || !visits) return esc(reason || '');
      const plural = function (n, word) { return n + ' ' + word + (n === '1' ? '' : 's'); };
      return plural(months[1], 'active month') + '<br>' + plural(visits[1], 'equiv. weekly visit');
    }

    function playerCard_(index, name, badgeHtml, reason, points, crowned) {
      return '' +
        '<div class="card player-card" title="' + esc(reason || '') + '">' +
          '<div class="' + rankClass(index) + '">' + (index + 1) + '</div>' +
          playerAvatar_(name, crowned) +
          '<div class="card-main">' +
            '<div class="card-name">' + badgeHtml + esc(name) + '</div>' +
            '<div class="card-reason">' + reasonSummary_(reason) + '</div>' +
          '</div>' +
          '<div class="card-points"><div class="num">' + points + '</div><div class="label">points</div></div>' +
        '</div>';
    }

    function renderMembers(list, filter) {
      const rows = list.filter(function (m) {
        return matchesFilter_(m.name, filter);
      });
      if (rows.length === 0) return '<div class="empty">No members match.</div>';
      return rows.map(function (m, i) {
        return playerCard_(i, m.name, '', m.reason, m.points, true);
      }).join('');
    }

    function renderRegulars(list, filter) {
      const rows = list.filter(function (r) {
        return matchesFilter_(r.name, filter);
      });
      if (rows.length === 0) return '<div class="empty">Nobody here yet.</div>';
      return rows.map(function (r, i) {
        const catBadge = r.category === 'Hybrid'
          ? '<span class="badge hybrid">Hybrid</span>'
          : '<span class="badge loyal">Loyal</span>';
        return playerCard_(i, r.name, catBadge, r.reason, r.points, false);
      }).join('');
    }

    function renderAll(list, filter) {
      const rows = list.filter(function (p) {
        return matchesFilter_(p.name, filter);
      });
      const cell = function (v) {
        return v === 'YES' ? '<span class="yes">YES</span>' : '<span class="no">NO</span>';
      };
      const body = rows.map(function (p) {
        return '<tr>' +
          '<td>' + esc(p.name) + '</td>' +
          '<td>' + p.paidMemberMonths + '</td>' +
          '<td>' + p.paidWeeklyVisits + '</td>' +
          '<td>' + p.weeklyEquivalentVisits + '</td>' +
          '<td>' + p.activeMonths + '</td>' +
          '<td>' + cell(p.recentActivity) + '</td>' +
          '<td>' + cell(p.memberEligible) + '</td>' +
          '<td>' + cell(p.regularEligible) + '</td>' +
          '<td>' + cell(p.semiRegularEligible) + '</td>' +
        '</tr>';
      }).join('');
      return '<div class="table-scroll"><table>' +
        '<thead><tr>' +
          '<th>Name</th><th>Member Mo.</th><th>Weekly Visits</th><th>Wkly-Equiv.</th>' +
          '<th>Active Mo.</th><th>Recent</th><th>Member?</th><th>Regular?</th><th>Semi?</th>' +
        '</tr></thead><tbody>' + body + '</tbody></table></div>';
    }

    function formatIDR(n) {
      return 'Rp ' + Math.round(n).toLocaleString('id-ID');
    }

    // amountClass tints the fee column: 'amount-owed' (red) or 'amount-credit' (green).
    function renderBalanceList(list, total, totalLabel, filter, amountClass) {
      const numClass = 'num' + (amountClass ? ' ' + amountClass : '');
      const rows = list.filter(function (item) {
        return matchesFilter_(item.name, filter);
      });
      if (rows.length === 0) return '<div class="empty">Nothing to show.</div>';
      const cards = rows.map(function (item, i) {
        return '' +
          '<div class="card balance-card">' +
            '<div class="' + rankClass(i) + '">' + (i + 1) + '</div>' +
            '<div class="card-main"><div class="card-name">' + esc(item.name) + '</div></div>' +
            '<div class="card-points"><div class="' + numClass + '">' + formatIDR(item.amount) + '</div></div>' +
          '</div>';
      }).join('');
      const totalCard =
        '<div class="card balance-card balance-total">' +
          '<div class="card-main"><div class="card-name">' + esc(totalLabel) + '</div></div>' +
          '<div class="card-points"><div class="' + numClass + '">' + formatIDR(total) + '</div></div>' +
        '</div>';
      return cards + totalCard;
    }

    function renderFinanceSideBySide(outstanding, outstandingTotal, credits, creditsTotal) {
      const maxLen = Math.max(outstanding.length, credits.length);
      let rows = '';
      for (let i = 0; i < maxLen; i++) {
        const o = outstanding[i];
        const c = credits[i];
        rows += '' +
          '<tr>' +
            '<td class="fin-name">' + (o ? esc(o.name) : '') + '</td>' +
            '<td class="outstanding-cell">' + (o ? formatIDR(o.amount) : '') + '</td>' +
            '<td class="fin-name">' + (c ? esc(c.name) : '') + '</td>' +
            '<td class="credit-cell">' + (c ? formatIDR(c.amount) : '') + '</td>' +
          '</tr>';
      }
      rows += '' +
        '<tr class="fin-total-row">' +
          '<td class="fin-name">Total</td>' +
          '<td class="outstanding-cell">' + formatIDR(outstandingTotal) + '</td>' +
          '<td class="fin-name">Total</td>' +
          '<td class="credit-cell">' + formatIDR(creditsTotal) + '</td>' +
        '</tr>';
      return '' +
        '<table class="finance-table">' +
          '<thead><tr><th colspan="2">Outstanding</th><th colspan="2">Player Credits</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>';
    }

    function computePerksEligible() {
      const outstandingNames = new Set(
        (DATA.outstanding || []).map(function (o) { return o.name.trim().toLowerCase(); })
      );
      const fromMembers = (DATA.members || []).map(function (m) {
        return { name: m.name, tier: 'Member', points: m.points, reason: m.reason };
      });
      const fromRegulars = (DATA.regular || []).map(function (r) {
        return { name: r.name, tier: 'Regular', points: r.points, reason: r.reason };
      });
      return fromMembers.concat(fromRegulars).filter(function (p) {
        return !outstandingNames.has(p.name.trim().toLowerCase());
      });
    }

    function renderPerks(filter) {
      const list = computePerksEligible().sort(function (a, b) { return b.points - a.points; });
      const rows = list.filter(function (item) {

    // ===================== Team Manager =====================

    // SHARED-LOGIC:attendance-parsing:START (generated from shared/draft-logic.js — do not edit here; run node scripts/sync-shared.js)
    function parseAttendanceNames(text) {
      return text.split('\n')
        .map(function (line) {
          let cleaned = line;
          // Strip leading numbering ("1.", "12.") — allowing the
          // invisible word-joiner characters our own "Copy Membership
          // List" export uses.
          cleaned = cleaned.replace(/^\s*\d+[.)]\s*[\u2060]*\s*/, '');
          // "[OFF] Substitute" notation: whoever is named after
          // [OFF]/(OFF) is the real attendee, replacing whoever was
          // listed before it. If nothing follows (no substitute given),
          // the whole line is dropped — that slot simply isn't filled.
          const offMatch = /[\[(]\s*off\s*[\])]\s*(.*)$/i.exec(cleaned);
          if (offMatch) cleaned = offMatch[1];
          // Strip leading status markers — several real-world checkmark
          // styles (✅ ☑️ ✔️ ✓), a leading "-" or bullet, and any
          // invisible characters mixed in with them.
          cleaned = cleaned.replace(/^[\s\u2060\u2705\u2611\u2713\u2714\uFE0F\-•*]+/, '');
          return cleaned.trim();
        })
        .filter(function (name) { return name.length > 0; });
    }

    function matchAttendanceToProfiles(names) {
      const byLowerName = {};
      (DATA.playerProfiles || []).forEach(function (p) { byLowerName[p.name.toLowerCase()] = p; });

      const unmatched = [];
      const seen = new Set();
      names.forEach(function (name) {
        const key = name.toLowerCase();
        if (seen.has(key)) return; // dedupe repeated names in the paste
        seen.add(key);
        const profile = byLowerName[key];
        if (profile) {
          matched.push(profile);
        } else {

      return { matched: matched, unmatched: unmatched };

    // SHARED-LOGIC:team-manager-algorithm:START (generated from shared/draft-logic.js — do not edit here; run node scripts/sync-shared.js)
    // impact's raw scale (-1..5, players who "don't know how to play at
    // all" score negative) is already narrower than skillLevel/
    // athleticism/defense's ~0..9 — and it's the stat that most directly
    // captures how much a player actually swings a real game, good or
    // bad, so it's weighted UP (x2) rather than halved: at x2 its ~12-point
    // swing outweighs any single one of the other stats below, making it
    // the single biggest factor in the composite rating.
    function computeCompositeRating(p) {
      const ts = (p.trueShootingPct !== null && p.trueShootingPct !== undefined ? p.trueShootingPct : 50) / 10;
      const impact = (p.impact || 0) * 2;
      return (p.skillLevel || 5) + ts + impact + (p.athleticism || 5) + (p.defense || 5);
    }

    function isBigPosition(pos) { return pos === 'C' || pos === 'PF'; }

    // The 3 non-scoring roles a functional team needs at least one of —
    // Scorer/Shooter/Hustle are already well-reflected by the composite
    // rating above, so they don't need a separate coverage check here.
    const KEY_ROLES = ['Playmaker', 'Rebounder', 'Defender'];

    function playerRoles(p) {
      const roles = [];
      if (p.primaryRole) roles.push(p.primaryRole);
      if (p.secondaryRole) roles.push(p.secondaryRole);
      return roles;
    }

    // A player who can credibly run point: an actual PG, or anyone
    // carrying Playmaker as a primary/secondary role.
    function isPlaymakingCapable(p) {
      return p.position === 'PG' || playerRoles(p).indexOf('Playmaker') !== -1;
    }

    // A player who can credibly anchor the paint: an actual Center, or —
    // the fallback the coach philosophy calls for when there aren't
    // enough Centers to go around — a PF who is either tagged Rebounder
    // (primary/secondary role) or taller than the average of all
    // C/PF players in the pool (`tallThreshold`, computed by the caller
    // from the whole player set so "good height" is relative to this
    // group, not a hardcoded number).
    function hasRimPresence(p, tallThreshold) {
      if (p.position === 'C') return true;
      if (p.position === 'PF') {
        if (playerRoles(p).indexOf('Rebounder') !== -1) return true;
        if (tallThreshold != null && (p.heightCm || 0) >= tallThreshold) return true;
      }
      return false;
    }

    function averageBigHeight(players) {
      const bigs = players.filter(function (p) { return isBigPosition(p.position); });
      if (bigs.length === 0) return null;
      return bigs.reduce(function (s, p) { return s + (p.heightCm || 175); }, 0) / bigs.length;
    }

    // Penalizes any team with ZERO players matching `pred`, but only when
    // there are enough matching players across the whole draft pool to
    // give every team at least one — e.g. don't penalize a team for
    // having no Center if there are only 2 Centers total across 4 teams,
    // since that's simply not achievable. This is what turns "a team
    // should have at least 1 Center if possible" into an actual scoring
    // term: it's a strong, not absolute, preference — the fairest split
    // among 126 (or the local-search result) will very rarely leave a
    // gap when one wasn't necessary.
    function coverageGapPenalty(teams, pred, penaltyEach) {
      const counts = teams.map(function (team) { return team.filter(pred).length; });
      const total = counts.reduce(function (a, b) { return a + b; }, 0);
      if (total < teams.length) return 0;
      let penalty = 0;
      counts.forEach(function (c) { if (c === 0) penalty += penaltyEach; });
      return penalty;
    }

    // A team's combined strength of its 2 best players by composite
    // rating — same "best available X" pattern as bestPlaymakerSkill
    // above, but for overall talent rather than playmaking. Every other
    // balance term in this file (ratingVariance, impactPenalty, ...)
    // only checks TEAM AVERAGES, and an average can't tell "2 stars + 3
    // weak fillers" apart from "5 solid mid-tier players" if both happen
    // to average out the same — which is exactly how e.g. 2 of a pool's
    // best players can end up on the same team while every score term
    // reports a perfectly balanced split. Balancing THIS value instead
    // (see starClusterPenalty below) catches that regardless of team
    // averages, and — unlike a fixed-size "top N players are elite" set —
    // it naturally covers "2nd tier but still clearly strong" players
    // too, without needing an arbitrary cutoff.
    function topTalentStrength(team) {
      const sorted = team.slice().sort(function (a, b) { return computeCompositeRating(b) - computeCompositeRating(a); });
      return sorted.slice(0, Math.min(2, sorted.length)).reduce(function (s, p) { return s + computeCompositeRating(p); }, 0);
    }

    // Penalizes a split where one team has NO ONE (primary or secondary
    // role) covering a key role while the other team has at least one —
    // e.g. a team with zero playmakers, when the other team has two.
    function roleCoveragePenalty(teamA, teamB) {
      let penalty = 0;
      KEY_ROLES.forEach(function (role) {
        const aHas = teamA.some(function (p) { return playerRoles(p).indexOf(role) !== -1; });
        const bHas = teamB.some(function (p) { return playerRoles(p).indexOf(role) !== -1; });
        if (aHas !== bHas) penalty += 1.5;
      });
      return penalty;
    }

    // Shared by both Team Manager and League Draft: a team's best
    // available ball-handler (see isPlaymakingCapable) — used to spread
    // out strong playmaking talent rather than letting it cluster on one
    // team. Folds in impact, not just raw skill, so this reflects "a
    // decent PG with good impact" rather than just "someone tagged PG."
    function bestPlaymakerSkill(team) {
      const capable = team.filter(isPlaymakingCapable);
      if (capable.length === 0) return 0;
      return Math.max.apply(null, capable.map(function (p) { return (p.skillLevel || 5) + (p.impact || 0) * 2; }));
    }

    // Every way to choose 5 of the 10 players (252 total), used below to
    // evaluate every one of the 126 distinct team pairings.
    function choose5(players) {
      const results = [];
      const n = players.length;
      (function combo(start, chosen) {
        if (chosen.length === 5) { results.push(chosen.slice()); return; }
        for (let i = start; i < n; i++) {
          chosen.push(i);
          combo(i + 1, chosen);
          chosen.pop();
        }
      })(0, []);
      return results;
    }

    // Evaluates all 126 distinct splits and returns them sorted by score
    // (lowest/fairest first) — kept separate from assembleTeams() so the
    // "pick one" strategy (see below) can change independently of the
    // scoring itself.
    function evaluateAllSplits(players) {
      const allCombos = choose5(players);
      const seenKeys = new Set();
      const results = [];

      allCombos.forEach(function (idxA) {
        const key = idxA.join(',');
        const idxBSet = new Set(idxA);
        const idxB = [];
        for (let i = 0; i < players.length; i++) if (!idxBSet.has(i)) idxB.push(i);
        const complementKey = idxB.join(',');
        if (seenKeys.has(complementKey)) return; // already evaluated this pairing from the other side
        seenKeys.add(key);

        const teamA = idxA.map(function (i) { return players[i]; });
        const teamB = idxB.map(function (i) { return players[i]; });

        const ratingA = teamA.reduce(function (s, p) { return s + computeCompositeRating(p); }, 0);
        const ratingB = teamB.reduce(function (s, p) { return s + computeCompositeRating(p); }, 0);
        const ratingDiff = Math.abs(ratingA - ratingB);

        const bigsA = teamA.filter(function (p) { return isBigPosition(p.position); }).length;
        const bigsB = teamB.filter(function (p) { return isBigPosition(p.position); }).length;
        const positionPenalty = Math.abs(bigsA - bigsB) * 2;

        const heightA = teamA.reduce(function (s, p) { return s + (p.heightCm || 175); }, 0) / 5;
        const heightB = teamB.reduce(function (s, p) { return s + (p.heightCm || 175); }, 0) / 5;
        const heightPenalty = Math.abs(heightA - heightB) / 5;

        const rolePenalty = roleCoveragePenalty(teamA, teamB);

        // Same reasoning as League Draft: the aggregate rating alone
        // doesn't stop two high-impact players (or two strong
        // playmakers) from landing on the same team as long as other
        // stats happen to average out.
        // impact carries a higher weight here (x3, vs x1.5 for the other
        // variance-based penalties below) to match its doubled weight in
        // computeCompositeRating — it's judged the stat most likely to
        // change how a real game actually plays out.
        const impactA = teamA.reduce(function (s, p) { return s + (p.impact || 0); }, 0) / 5;
        const impactB = teamB.reduce(function (s, p) { return s + (p.impact || 0); }, 0) / 5;
        const impactPenalty = Math.abs(impactA - impactB) * 3;

        const playmakerA = bestPlaymakerSkill(teamA);
        const playmakerB = bestPlaymakerSkill(teamB);
        const playmakerPenalty = Math.abs(playmakerA - playmakerB) * 1.5;

        // Coverage gaps: a team left with zero Centers (or zero
        // rim-presence fallback) or zero playmaking-capable players when
        // there were enough to go around — see coverageGapPenalty above.
        const tallThreshold = averageBigHeight(players);
        const centerGapPenalty = coverageGapPenalty([teamA, teamB], function (p) { return p.position === 'C'; }, 6);
        const rimGapPenalty = coverageGapPenalty([teamA, teamB], function (p) { return hasRimPresence(p, tallThreshold); }, 4);
        const playmakerGapPenalty = coverageGapPenalty([teamA, teamB], isPlaymakingCapable, 6);

        // Star clustering: don't let 2 of the pool's best players land on
        // the same team just because the rest of the roster happens to
        // average out — see topTalentStrength above.
        const starPenalty = Math.abs(topTalentStrength(teamA) - topTalentStrength(teamB)) * 2;

        const score = ratingDiff + positionPenalty + heightPenalty + rolePenalty + impactPenalty + playmakerPenalty +
          centerGapPenalty + rimGapPenalty + playmakerGapPenalty + starPenalty;

        results.push({ teamA: teamA, teamB: teamB, ratingA: ratingA, ratingB: ratingB, score: score });
      });

      results.sort(function (a, b) { return a.score - b.score; });
      return results;
    }

    // Picking the single mathematically-best split every time means the
    // same 10 people always get split the same way. Instead, pick
    // randomly among the 10 fairest splits (out of 126 total — the top
    // ~8%) — every option is still close to optimal, but re-running this
    // on the same group gives real variety instead of a fixed result.
    function assembleTeams(players) {
      const allResults = evaluateAllSplits(players);
      const topK = allResults.slice(0, Math.min(10, allResults.length));
      return topK[Math.floor(Math.random() * topK.length)];
    }
    // SHARED-LOGIC:team-manager-algorithm:END

    function renderTeamCard(title, team, rating) {

      const rows = players.map(function (p) {
        return '' +

    function renderTeamResults(result) {

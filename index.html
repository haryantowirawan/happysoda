    // ===================== League Draft =====================
    // Same attendance-parsing/matching as Team Manager (parseAttendanceNames,
    // matchAttendanceToProfiles are generic — reused as-is), but this
    // splits EVERYONE pasted in into N teams, not a hand-picked 10 into 2.

    // SHARED-LOGIC:league-draft-algorithm:START (generated from shared/draft-logic.js — do not edit here; run node scripts/sync-shared.js)
    function computeTeamSizes(total, numTeams) {
      const base = Math.floor(total / numTeams);
      const remainder = total % numTeams;
      const sizes = [];
      for (let i = 0; i < numTeams; i++) sizes.push(i < remainder ? base + 1 : base);
      return sizes;
    }

    function findMaxValidTeams(total) {
      let maxTeams = 1;
      for (let t = 1; t <= total; t++) {
        if (Math.floor(total / t) >= 5) maxTeams = t;
      }
      return maxTeams;
    }

    function validateTeamCount(total, numTeams) {
      if (!numTeams || numTeams < 1) {
        return { valid: false, message: 'Enter a valid number of teams.' };
      }
      const smallest = Math.floor(total / numTeams);
      if (smallest < 5) {
        const maxTeams = findMaxValidTeams(total);
        return {
          valid: false,
          message: total + ' players into ' + numTeams + ' teams would leave some teams with only ' +
            smallest + ' player' + (smallest === 1 ? '' : 's') + ' (minimum is 5). Try up to ' +
            maxTeams + ' team' + (maxTeams === 1 ? '' : 's') + ' instead.',
        };
      }
      return { valid: true };
    }

    // Serpentine draft order (1,2,3,4,4,3,2,1,1,2,3,...), skipping a team
    // once it's reached its (possibly smaller) capacity — this is what
    // makes uneven team sizes like 8/8/8/7 work correctly.
    function buildSnakeOrder(teamSizes) {
      const numTeams = teamSizes.length;
      const remaining = teamSizes.slice();
      const totalPlayers = teamSizes.reduce(function (a, b) { return a + b; }, 0);
      const order = [];
      let direction = 1;
      while (order.length < totalPlayers) {
        const seq = [];
        for (let i = 0; i < numTeams; i++) seq.push(direction === 1 ? i : numTeams - 1 - i);
        seq.forEach(function (teamIdx) {
          if (remaining[teamIdx] > 0) {
            order.push(teamIdx);
            remaining[teamIdx]--;
          }
        });
        direction *= -1;
      }
      return order.slice(0, totalPlayers);
    }

    function snakeDraftAssign(players, teamSizes) {
      const sorted = players.slice().sort(function (a, b) { return computeCompositeRating(b) - computeCompositeRating(a); });
      const order = buildSnakeOrder(teamSizes);
      const teams = teamSizes.map(function () { return []; });
      for (let i = 0; i < sorted.length; i++) teams[order[i]].push(sorted[i]);
      return teams;
    }

    function computeTeamAvgRating(team) {
      const total = team.reduce(function (s, p) { return s + computeCompositeRating(p); }, 0);
      return total / team.length;
    }

    // Extends the same position/role-coverage philosophy from Team
    // Manager's 2-team scoring to N teams: penalize uneven rating
    // averages, uneven "big man" distribution, uneven height, any
    // key role (Playmaker/Rebounder/Defender) that some teams have
    // covered and others don't, and — see below — a team left with zero
    // Centers or zero playmaking-capable players when the pool had
    // enough to cover every team.
    function computeMultiTeamScore(teams) {
      const avgs = teams.map(computeTeamAvgRating);
      const overallAvg = avgs.reduce(function (a, b) { return a + b; }, 0) / avgs.length;
      const ratingVariance = avgs.reduce(function (s, a) { return s + Math.pow(a - overallAvg, 2); }, 0);

      const bigsCounts = teams.map(function (team) {
        return team.filter(function (p) { return isBigPosition(p.position); }).length;
      });
      const avgBigs = bigsCounts.reduce(function (a, b) { return a + b; }, 0) / bigsCounts.length;
      const positionPenalty = bigsCounts.reduce(function (s, c) { return s + Math.abs(c - avgBigs); }, 0);

      let rolePenalty = 0;
      KEY_ROLES.forEach(function (role) {
        const coverage = teams.map(function (team) {
          return team.some(function (p) { return playerRoles(p).indexOf(role) !== -1; });
        });
        const covered = coverage.filter(Boolean).length;
        const uncovered = teams.length - covered;
        if (covered > 0 && uncovered > 0) rolePenalty += uncovered * 1.5;
      });

      const heightAvgs = teams.map(function (team) {
        return team.reduce(function (s, p) { return s + (p.heightCm || 175); }, 0) / team.length;
      });
      const overallHeightAvg = heightAvgs.reduce(function (a, b) { return a + b; }, 0) / heightAvgs.length;
      const heightPenalty = heightAvgs.reduce(function (s, h) { return s + Math.abs(h - overallHeightAvg); }, 0) / 5;

      // Impact balance: the overall composite rating already folds in
      // impact at double-weight (see computeCompositeRating), but that
      // alone doesn't stop two very high-impact players from landing on
      // the same team as long as their OTHER stats happen to average out
      // across the roster. Impact tends to swing real games more than
      // the aggregate number suggests, so it gets its own dedicated
      // balance check too, weighted up (x3 below, vs x1.5 for the other
      // variance penalties) to match.
      const impactAvgs = teams.map(function (team) {
        return team.reduce(function (s, p) { return s + (p.impact || 0); }, 0) / team.length;
      });
      const overallImpactAvg = impactAvgs.reduce(function (a, b) { return a + b; }, 0) / impactAvgs.length;
      const impactPenalty = impactAvgs.reduce(function (s, a) { return s + Math.pow(a - overallImpactAvg, 2); }, 0);

      // Playmaking balance: spreads out the strongest ball-handlers (PG
      // by position, or anyone with Playmaker as a role) instead of
      // letting one team monopolize the best playmaking talent — a
      // single strong point guard changes a game more than their raw
      // rating number alone implies.
      const bestPlaymakerSkills = teams.map(bestPlaymakerSkill);
      const overallPlaymakerAvg = bestPlaymakerSkills.reduce(function (a, b) { return a + b; }, 0) / bestPlaymakerSkills.length;
      const playmakerPenalty = bestPlaymakerSkills.reduce(function (s, v) { return s + Math.pow(v - overallPlaymakerAvg, 2); }, 0);

      // Coverage gaps: every team should have at least 1 Center if
      // there are enough Centers in the whole draft pool to give each
      // team one — falling back to a tall/Rebounder-tagged PF when there
      // aren't — and at least 1 playmaking-capable player (PG, or a
      // Playmaker-role player) so no team is left without anyone who can
      // run the offense. See coverageGapPenalty.
      const allPlayers = [].concat.apply([], teams);
      const tallThreshold = averageBigHeight(allPlayers);
      const centerGapPenalty = coverageGapPenalty(teams, function (p) { return p.position === 'C'; }, 6);
      const rimGapPenalty = coverageGapPenalty(teams, function (p) { return hasRimPresence(p, tallThreshold); }, 4);
      const playmakerGapPenalty = coverageGapPenalty(teams, isPlaymakingCapable, 6);

      // Star clustering: don't let 2+ of the pool's best players land on
      // the same team just because the rest of the roster happens to
      // average out — see topTalentStrength above.
      const topTalentValues = teams.map(topTalentStrength);
      const overallTopTalentAvg = topTalentValues.reduce(function (a, b) { return a + b; }, 0) / topTalentValues.length;
      const starPenalty = topTalentValues.reduce(function (s, v) { return s + Math.pow(v - overallTopTalentAvg, 2); }, 0);

      return ratingVariance + positionPenalty * 2 + rolePenalty + heightPenalty + impactPenalty * 3 + playmakerPenalty * 1.5 +
        centerGapPenalty + rimGapPenalty + playmakerGapPenalty + starPenalty * 2;
    }

    // Randomly swaps players between two teams, keeping the swap only if
    // it improves the overall score — a bounded local-search polish on
    // top of the snake draft's starting point. Brute-forcing every
    // possible N-way partition (unlike Team Manager's 126 fixed splits)
    // isn't remotely feasible once there are more than 2 teams.
    function localSearchImprove(teams, iterations) {
      let currentScore = computeMultiTeamScore(teams);
      const numTeams = teams.length;
      if (numTeams < 2) return { teams: teams, score: currentScore };

      for (let iter = 0; iter < iterations; iter++) {
        const teamA = Math.floor(Math.random() * numTeams);
        let teamB = Math.floor(Math.random() * numTeams);
        while (teamB === teamA) teamB = Math.floor(Math.random() * numTeams);
        const idxA = Math.floor(Math.random() * teams[teamA].length);
        const idxB = Math.floor(Math.random() * teams[teamB].length);

        const playerA = teams[teamA][idxA];
        const playerB = teams[teamB][idxB];
        teams[teamA][idxA] = playerB;
        teams[teamB][idxB] = playerA;

        const newScore = computeMultiTeamScore(teams);
        if (newScore < currentScore) {
          currentScore = newScore;
        } else {
          teams[teamA][idxA] = playerA;
          teams[teamB][idxB] = playerB;
        }
      }
      return { teams: teams, score: currentScore };
    }

    // Like Team Manager's "top 10 of 126, pick randomly" — but since we
    // can't enumerate every possible N-way partition, variety instead
    // comes from running the whole randomized local-search pipeline
    // several independent times and picking randomly among the best few
    // results, rather than always returning the single best attempt.
    function assembleLeagueTeams(players, numTeams) {
      const teamSizes = computeTeamSizes(players.length, numTeams);
      const attempts = [];
      const NUM_ATTEMPTS = 8;
      const ITERATIONS_PER_ATTEMPT = 400;
      for (let a = 0; a < NUM_ATTEMPTS; a++) {
        const initial = snakeDraftAssign(players, teamSizes);
        attempts.push(localSearchImprove(initial, ITERATIONS_PER_ATTEMPT));
      }
      attempts.sort(function (x, y) { return x.score - y.score; });
      const topPool = attempts.slice(0, Math.min(3, attempts.length));
      const choice = topPool[Math.floor(Math.random() * topPool.length)];
      return { teams: choice.teams, score: choice.score, teamSizes: teamSizes };
    }
    // SHARED-LOGIC:league-draft-algorithm:END

    function getAdminToken() {
      try { return localStorage.getItem('hsAdminToken') || null; } catch (e) { return null; }
    }
    function isAdmin() { return !!getAdminToken(); }
    function setAdminToken(token) {
      try { localStorage.setItem('hsAdminToken', token); } catch (e) { /* ignore */ }
    }
    function clearAdminToken() {
      try { localStorage.removeItem('hsAdminToken'); } catch (e) { /* ignore */ }
    }

    function setLoadingOverlay_(show, text) {
      if (text) document.getElementById('loadingOverlayText').textContent = text;
      document.getElementById('loadingOverlay').classList.toggle('show', show);
    }

    // Internal Leagues is fetched as its own separate, always-fresh request
    // (?format=json&part=leagues) rather than being part of the main
    // dashboard payload — see app-script-backend's CLAUDE.md, 2026-09-17
    // entry. Called once, non-blocking, right after the main dashboard
    // renders (so it never delays first paint), and again after any league
    // write instead of a full loadData() (a league write never touches
    // dashboard/tier/outstanding data).
    function fetchLeagues_() {
      return fetch(APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf('?') === -1 ? '?' : '&') + 'format=json&part=leagues')
        .then(function (r) { return r.json(); })
        .then(function (json) {
          DATA.leagues = json.leagues;
          DATA.warnings = (DATA.warnings || []).concat(json.warnings || []);
          document.getElementById('internalLeaguesContent').innerHTML = renderInternalLeaguesPage();
          setLoadingOverlay_(false);
        })
        .catch(function (err) {
          console.error('Could not load Internal Leagues:', err);
          setLoadingOverlay_(false);
        });
    }

    // Sent as text/plain, not application/json — a cross-origin JSON POST
    // triggers a CORS preflight (OPTIONS) that Apps Script web apps can't
    // answer, so text/plain (a CORS "simple request") is used instead; the
    // server reads the raw body regardless of the declared content type.
    // Shows the spinner overlay immediately (writes to the Leagues sheet
    // are slow enough that no feedback reads as "did my click even
    // register?") and leaves it up on success — the caller always follows
    // with a loadData() that keeps it visible through to fresh data, so
    // hiding it here first would just flicker. Only hides it on error,
    // since then nothing else will.
    function callLeagueApi_(action, payload) {
      setLoadingOverlay_(true, 'Saving…');
      const body = Object.assign({ action: action, adminToken: getAdminToken() }, payload);
      return fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body),
      })
        .then(function (r) { return r.json(); })
        .then(function (json) {
          if (!json.ok) {
            // A remembered passcode that the server no longer accepts
            // (e.g. ADMIN_TOKEN was changed) drops admin mode.
            if (json.error === 'Unauthorized.') { clearAdminToken(); updateAdminToggleLabel(); }
            throw new Error(json.error || 'Request failed.');
          }
          return json.result;
        })
        .catch(function (err) {
          setLoadingOverlay_(false);
          throw err;
        });
    }

    // Checks a passcode with the server (doPost's verifyAdmin action) before
    // turning admin mode on. Previously whatever was typed was stored and the
    // admin controls appeared; only the writes themselves were rejected.
    // Resolves true (correct), false (rejected) or null (couldn't reach the
    // server). A stored passcode is only cleared on a definite rejection.
    // `silent` re-checks a remembered passcode without the overlay.
    function verifyAdminToken_(token, silent) {
      if (!silent) setLoadingOverlay_(true, 'Checking passcode…');
      return fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'verifyAdmin', adminToken: token }),
      })
        .then(function (r) { return r.json(); })
        .then(function (json) {
          if (json.ok) setAdminToken(token);
          else if (json.error === 'Unauthorized.') clearAdminToken();
          return !!json.ok;
        })
        .catch(function (err) {
          console.error('Could not verify admin passcode:', err);
          if (!silent) alert('Could not check the passcode: ' + err.message);
          return null;
        })
        .then(function (ok) {
          if (!silent) setLoadingOverlay_(false);
          updateAdminToggleLabel();
          renderCreateLeagueSection();
          document.getElementById('internalLeaguesContent').innerHTML = renderInternalLeaguesPage();
          return ok;
        });
    }
    let adminRecheckDone_ = false;

    function updateAdminToggleLabel() {
      const btn = document.getElementById('adminToggle');
      if (btn) setMenuItemLabel_(btn, isAdmin() ? 'unlock' : 'lock', 'Admin');

    // Shown next to League Draft's Assemble Teams button, only once teams

      const played = games.filter(function (g) { return g.played === true || g.played === 'TRUE'; }).length;

    // Deliberately a plain text field, not <input type="date"> — a native
    // date input's displayed format follows the viewer's browser/OS
    // locale (mm/dd/yyyy, dd/mm/yyyy, etc.) with no way to force one
    // consistently from the page, so dd/mm/yyyy is enforced here instead.
    function isValidDMY_(s) {
      const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);
      if (!m) return false;
      const day = parseInt(m[1], 10), month = parseInt(m[2], 10), year = parseInt(m[3], 10);
      if (month < 1 || month > 12) return false;
      const daysInMonth = new Date(year, month, 0).getDate();
      return day >= 1 && day <= daysInMonth;
    }

    function isGamePlayed_(game) {
      // A checkbox written to the sheet reads back as either a real
      // boolean or the string 'TRUE' depending on the cell, so every
      // read of this field has to accept both.
      return game.played === true || game.played === 'TRUE';
    }

    // Normally already resolved and stored server-side (updateGame_
    // auto-derives and writes the winner when "Auto (by score)" is
    // chosen), but this fallback keeps it correct for any older row
    // saved before that existed. Returns '' for an unplayed or tied
    // game, which the server deliberately leaves blank.
    function gameWinner_(game) {
      if (game.winningTeam) return game.winningTeam;
      const hs = Number(game.homeScore), as = Number(game.awayScore);
      if (!isGamePlayed_(game) || isNaN(hs) || isNaN(as) || hs === as) return '';
      return hs > as ? game.homeTeam : game.awayTeam;
    }

    // Closed leagues have an official, snapshotted winner. An active
    // league gets a live version of the same line once at least one game
    // has been played (before that, standings are just an arbitrary
    // alphabetical tie, not worth declaring) — "Current Leader" while
    // games remain, switching to "Winner" once every game is played even
    // though the league hasn't been formally closed yet. Returns null
    // when there is nothing worth declaring.
    function leagueWinnerLabel_(league) {
      if (league.status === 'closed' && league.winnerTeam) {
        return { label: 'Winner', team: league.winnerTeam };
      }
      if (league.status === 'active' && league.standings.length && league.games.some(isGamePlayed_)) {
        return {
          label: league.games.every(isGamePlayed_) ? 'Winner' : 'Current Leader',
          team: league.standings[0].team
        };
      }
      return null;
    }

    // A league shares as TEXT, not as an image. The Games table is seven
    // columns wide, so a phone-width screenshot of it goes illegible the
    // moment WhatsApp resizes the picture — the same fight the League
    // Draft export has already had twice (see the Changelog). Text
    // arrives crisp at whatever size the reader's phone is set to, stays
    // selectable and quotable, and shows up in the chat-list preview.
    // WhatsApp's own *bold* markup does the formatting.
    function buildLeagueShareText_(league) {
      const lines = ['🏀 *' + league.name + '*'];
      const winner = leagueWinnerLabel_(league);
      if (winner) lines.push('🏆 ' + winner.label + ': ' + winner.team);
      lines.push(league.numTeams + ' teams · ' + computeLeagueGameCounts_(league.games));

      // All-zero standings say nothing, so a league nobody has played in
      // yet shares as teams + schedule only.
      if (league.games.some(isGamePlayed_)) {
        lines.push('', '*Standings*');
        league.standings.forEach(function (s, i) {
          lines.push((i + 1) + '. ' + s.team + ' — ' + s.wins + 'W ' + s.losses + 'L (' +
            (s.diff > 0 ? '+' : '') + s.diff + ')');
        });
      }

      if (league.games.length) {
        lines.push('', '*Games*');
        league.games.forEach(function (g) {
          const played = isGamePlayed_(g);
          const parts = [];
          if (g.stage) parts.push(g.stage);
          if (played) {
            parts.push(g.homeTeam + ' ' + g.homeScore + '-' + g.awayScore + ' ' + g.awayTeam);
            const w = gameWinner_(g);
            if (w) parts.push('🏆 ' + w);
          } else {
            parts.push(g.homeTeam + ' vs ' + g.awayTeam);
            const when = [g.date, g.time].filter(Boolean).join(' ');
            if (when) parts.push(when);
          }
          lines.push((played ? '✅ ' : '⏳ ') + parts.join(' · '));
        });
      }

      lines.push('', '*Teams*');
      league.teams.forEach(function (t) {
        // *bold* the team name so each roster line has a visible header in the chat.
        lines.push('*' + t.teamName + ':* ' + t.players.map(function (p) {
          return p.name + (p.position ? ' (' + p.position + ')' : '');
        }).join(', '));
      });

      return lines.join('\n');
    }

    function shareLeague_(leagueId, btn) {
      const league = ((DATA.leagues && DATA.leagues.list) || []).filter(function (l) {
        return l.leagueId === leagueId;
      })[0];
      if (!league) {
        alert('Could not find that league to share.');
        return;
      }
      const text = buildLeagueShareText_(league);

      // wa.me is WhatsApp's own deep link: on a phone it hands off to the
      // app, on a desktop to WhatsApp Web, both with the message already
      // typed so all that's left is picking the chat. Deliberately NOT
      // navigator.share — ui.html is served inside the sandboxed iframe
      // Apps Script wraps every web app in, which doesn't grant the
      // web-share permission policy, so the native sheet would reject
      // there and this button would behave differently in the two
      // clients. Opened synchronously from the click so no popup blocker
      // treats it as unsolicited.
      let win = null;
      try { win = window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank'); } catch (err) { win = null; }
      if (win) return;

      // Blocked anyway — fall back to the clipboard so the message isn't lost.
      const original = btn.textContent;
      const flash = function (label) {
        btn.textContent = label;
        setTimeout(function () { btn.textContent = original; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { flash('✅'); }).catch(function () {
          if (fallbackCopy(text)) flash('✅');
          else alert(text);
        });
      } else if (fallbackCopy(text)) {
        flash('✅');
      } else {
        alert(text);
      }
    }

      // Sharing is a read action, so unlike rename/close/delete this one

        '<div class="il-league-block">' +

            '<div class="il-league-meta">' + esc(league.numTeams) + ' teams · ' + computeLeagueGameCounts_(league.games) + '</div>' +

    function renderInternalLeaguesPage() {
      if (DATA.leagues === undefined) {
        return '<div class="il-empty">Loading leagues…</div>';

      const leagues = (DATA.leagues && DATA.leagues.list) || [];
      if (leagues.length === 0) {

      const active = leagues.find(function (l) { return l.status === 'active'; });

        ? renderLeagueDetail_(active, isAdmin())

    function renderAttendanceChart() {
      const data = DATA.monthlyAttendance || [];
      if (data.length === 0) return '';
      const values = data.map(function (d) { return d.count; });
      // The last bar is the selected "as of" end month, which is often
      // still in progress (or, if picked ahead of the real current month,
      // barely started) — its naturally low, partial count would otherwise
      // pull the min way down and squash every completed month into a
      // narrow high band near the top of the chart. Calibrate the zoom off
      // the completed months only, then plot the last bar on that same
      // scale (clamped to 100%, since a still-forming month can't sensibly
      // set the scale but could in principle already exceed it).
      const scaleValues = values.length > 1 ? values.slice(0, -1) : values;
      const max = Math.max.apply(null, scaleValues) || 1;
      const min = Math.min.apply(null, scaleValues);
      const range = max - min;
      // Zoom the baseline so month-to-month differences are actually
      // visible even when values are clustered close together, instead of
      // every bar looking nearly full-height against a 0 baseline.
      const baseline = range > 0 ? Math.max(0, min - range * 0.3) : 0;
      const span = (max - baseline) || 1;

      const cols = data.map(function (d, i) {
        const pct = Math.min(Math.max(Math.round(((d.count - baseline) / span) * 100), 4), 100);
        return '' +
          '<div class="trend-bar-col' + (i === data.length - 1 ? ' current' : '') + '">' +
            '<div class="trend-bar-value">' + d.count + '</div>' +
            '<div class="trend-bar" style="height:' + pct + '%"></div>' +
            '<div class="trend-bar-label">' + formatMonthLabel(d.month) + '</div>' +
          '</div>';
      }).join('');
      return '' +
        '<div class="trend-chart-wrap">' +
          '<div class="chart-head">' +
            '<span class="chart-icon">' + icon_('bars') + '</span>' +
            '<div class="chart-titles">' +
              '<div class="trend-chart-title">Active Players Per Month</div>' +
              '<div class="chart-sub">Unique players each month</div>' +
            '</div>' +
            renderTrendBadge_(data) +
          '</div>' +
          '<div class="trend-chart">' + cols + '</div>' +
        '</div>';
    }

    // Month-over-month change for the chart header: last month (the one
    // before the selected "as of" month, which is usually still in
    // progress) against the month before that.
    function renderTrendBadge_(data) {
      const end = data.length - 2;
      if (end < 1 || !data[end - 1].count) return '';
      const cur = data[end];
      const prev = data[end - 1];
      const pct = Math.round(((cur.count - prev.count) / prev.count) * 100);
      const dir = pct > 0 ? 'up' : (pct < 0 ? 'down' : 'flat');
      const iconName = dir === 'up' ? 'trendUp' : (dir === 'down' ? 'trendDown' : 'trendFlat');
      return '' +
        '<div class="trend-badge ' + dir + '" title="' + formatMonthLabel(cur.month) + ' vs ' + formatMonthLabel(prev.month) + '">' +
          '<div class="trend-badge-num">' + icon_(iconName) + (pct > 0 ? '+' : '') + pct + '%</div>' +
          '<div class="trend-badge-sub">last month</div>' +
        '</div>';
    }

    function showFatalError(message) {
      document.getElementById('statusDot').classList.add('error');
      document.getElementById('pageTitle').textContent = 'Could not load data';
      document.getElementById('content').innerHTML = '';
      document.getElementById('warningsBox').innerHTML =
        '<div class="warnings fatal"><strong>Something went wrong</strong>' + esc(message) + '</div>';
      document.getElementById('copyrightLabel').innerHTML =
        'Copyright © ' + new Date().getFullYear() + ' Happy Soda<br>Authored by: Haryanto Wirawan';
    }

    let currentMonthParam = null;
    let currentRecordsMonthParam = null;

    // Simulated progress for the very first loadData() call only (later
    // calls — month-picker changes, league actions, the 15-min refresh —
    // already use #loadingOverlay's spinner instead, since #content is
    // showing the real dashboard by then, not this placeholder). There's
    // no real byte-level progress signal worth tracking for a single
    // fetch response, so this eases toward 90% and holds until the
    // response actually arrives — see the matching comment in
    // ../app-script-backend/ui.html.
    let firstLoadTicker = null;
    function startFirstLoadProgress() {
      const fill = document.getElementById('initialProgressFill');
      if (!fill) return;
      let pct = 4;
      fill.style.width = pct + '%';
      firstLoadTicker = setInterval(function () {
        pct += (90 - pct) * 0.08;
        fill.style.width = Math.min(pct, 90) + '%';
      }, 250);
    }
    function finishFirstLoadProgress() {
      if (firstLoadTicker) {
        clearInterval(firstLoadTicker);
        firstLoadTicker = null;
      }
    }

    function loadData(monthParam, recordsMonthParam) {
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_') === 0) {
        finishFirstLoadProgress();
        document.getElementById('loadingOverlay').classList.remove('show');
        showFatalError('APPS_SCRIPT_URL is not configured in this page yet.');
        return;
      }

      // Preserve whichever param wasn't explicitly passed this call, so
      // changing one month picker never resets the other.
      const effectiveMonth = monthParam !== undefined ? monthParam : currentMonthParam;
      const effectiveRecordsMonth = recordsMonthParam !== undefined ? recordsMonthParam : currentRecordsMonthParam;

      let url = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf('?') === -1 ? '?' : '&') + 'format=json';
      if (effectiveMonth) url += '&month=' + encodeURIComponent(effectiveMonth);
      if (effectiveRecordsMonth) url += '&recordsMonth=' + encodeURIComponent(effectiveRecordsMonth);

      fetch(url)
        .then(function (res) {
          if (!res.ok) throw new Error('Server responded with status ' + res.status);
          return res.json();
        })
        .then(function (json) {
          DATA = json;
          currentMonthParam = effectiveMonth || null;
          currentRecordsMonthParam = effectiveRecordsMonth || null;
          document.getElementById('updatedLabel').textContent =
            'Updated ' + formatUpdatedTime(new Date(DATA.generatedAt));

          if (DATA.warnings && DATA.warnings.length) {
            document.getElementById('warningsBox').innerHTML =
              '<div class="warnings"><strong>' + DATA.warnings.length + ' warning(s)</strong>' +
              DATA.warnings.map(esc).join('<br>') + '</div>';
          } else {
            document.getElementById('warningsBox').innerHTML = '';
          }

          if (DATA.sourcesUsed && DATA.sourcesUsed.length) {
            document.getElementById('footerLabel').textContent =
              'Auto-refreshes every 15 minutes · ' + DATA.sourcesUsed.join(', ');
          } else {
            document.getElementById('footerLabel').textContent = 'Auto-refreshes every 15 minutes';
          }

          document.getElementById('copyrightLabel').innerHTML =
            'Copyright © ' + (DATA.currentYear || new Date().getFullYear()) + ' Happy Soda<br>Authored by: Haryanto Wirawan';

          finishFirstLoadProgress();
          buildDashboard();
          document.getElementById('loadingOverlay').classList.remove('show');
        })
        .catch(function (err) {
          finishFirstLoadProgress();
          document.getElementById('loadingOverlay').classList.remove('show');
          showFatalError(
            'Could not reach the data source (' + err.message + '). ' +
            'If this keeps happening, check that APPS_SCRIPT_URL is correct and the Apps Script ' +
            'web app is deployed with "Who has access: Anyone".'
          );
        });
    }

    startFirstLoadProgress();
    loadData();

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(textarea);
      return ok;
    }

    function copyPerksList(btn) {
      const filterValue = document.getElementById('searchBox')
        ? document.getElementById('searchBox').value.trim().toLowerCase() : '';
      const list = computePerksEligible()
        .filter(function (item) { return !filterValue || item.name.toLowerCase().includes(filterValue); })
        .sort(function (a, b) { return b.points - a.points; });

      if (list.length === 0) {
        alert('No one is currently eligible to export.');
        return;
      }

      const lines = ['Perks Eligible members/regulars:', ''];
      list.forEach(function (item, i) { lines.push((i + 1) + '. ' + item.name); });
      const text = lines.join('\n');

      const showCopied = function () {
        const original = btn.textContent;
        btn.textContent = '✅ Copied!';
        setTimeout(function () { btn.textContent = original; }, 1500);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showCopied).catch(function () {
          if (fallbackCopy(text)) showCopied();
          else alert('Could not copy automatically. Here is the list:\n\n' + text);
        });
      } else {
        if (fallbackCopy(text)) showCopied();
        else alert('Could not copy automatically. Here is the list:\n\n' + text);
      }
    }

    function copyMembershipList(btn) {
      const roster = DATA.membershipRoster || [];
      if (roster.length === 0) {
        alert('No membership roster found for this month.');
        return;
      }
      const community = DATA.membershipReminderCommunity || 'HS';
      const monthLabel = DATA.recordsMonthLabelSeptStyle || DATA.recordsMonth || '';
      const reminderLines = DATA.membershipReminderLines || [];

      const lines = [];
      lines.push('List member ' + community + ' ' + monthLabel);
      reminderLines.forEach(function (l) { lines.push(l); });
      roster.forEach(function (m, i) {
        const check = m.paid ? '\u2705' : '';
        lines.push(' ' + (i + 1) + '.\u2060 \u2060' + check + m.name);
      });
      const text = lines.join('\n');

      const showCopied = function () {
        const original = btn.textContent;
        btn.textContent = '✅ Copied!';
        setTimeout(function () { btn.textContent = original; }, 1500);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showCopied).catch(function () {
          if (fallbackCopy(text)) showCopied();
          else alert('Could not copy automatically. Here is the list:\n\n' + text);
        });
      } else {
        if (fallbackCopy(text)) showCopied();
        else alert('Could not copy automatically. Here is the list:\n\n' + text);
      }
    }

    function exportImageFromElement(elementId, filenamePrefix, btn) {
      if (typeof html2canvas === 'undefined') {
        alert('Image export library failed to load — check your internet connection and try again.');
        return;
      }
      const original = btn.textContent;
      btn.textContent = '⏳ Generating…';
      btn.disabled = true;
      document.body.classList.add('exporting-records');
      const target = document.getElementById(elementId);
      // Only the finance container is normally hidden (display:none) and
      // needs forcing visible via inline style. The records container is
      // already part of the visible page — forcing an inline display here
      // would override the CSS grid layout below it (inline styles beat
      // any class-based stylesheet rule), so leave its display entirely
      // to CSS, controlled purely by the "exporting-records" body class.
      const needsForceShow = elementId === 'financeExportCapture';
      if (needsForceShow) target.style.display = 'block';

      // Records export uses a 2-column grid; the on-screen container is
      // only phone-width, which isn't enough room for a legible font per
      // column. Widen it just for the capture (doesn't affect normal
      // browsing, which isn't in this "exporting-records" state) so the
      // fee amounts don't clip. The finance export needs it for the same
      // reason: its table is 4 columns (name + fee, twice) at 16px, which
      // overflows the card on a phone-width container.
      const needsWiden = elementId === 'recordsExportCapture' || elementId === 'ldExportCapture' ||
        elementId === 'financeExportCapture';
      // 700px of card + the 16px gutter either side the capture root
      // gets during an export.
      if (needsWiden) target.style.width = '732px';

      setTimeout(function () {
        html2canvas(target, { scale: 2 }).then(function (canvas) {
          document.body.classList.remove('exporting-records');
          if (needsForceShow) target.style.display = 'none';
          if (needsWiden) target.style.width = '';
          btn.textContent = original;
          btn.disabled = false;
          const link = document.createElement('a');
          link.download = filenamePrefix + '-' + (DATA.recordsMonth || DATA.currentYear || 'export') + '.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        }).catch(function (err) {
          document.body.classList.remove('exporting-records');
          if (needsForceShow) target.style.display = 'none';
          if (needsWiden) target.style.width = '';
          btn.textContent = original;
          btn.disabled = false;
          alert('Could not generate image: ' + err.message);
        });
      }, 50);
    }

    // Event delegation: works regardless of how many times these buttons
    // get recreated by buildDashboard() on every refresh.
    document.addEventListener('click', function (e) {
      const perksBtn = e.target.closest('#exportPerksBtn');
      if (perksBtn) copyPerksList(perksBtn);

      const copyMembershipBtn = e.target.closest('#copyMembershipListBtn');
      if (copyMembershipBtn) copyMembershipList(copyMembershipBtn);

      const exportRecordsBtn = e.target.closest('#exportRecordsImageBtn');
      if (exportRecordsBtn) exportImageFromElement('recordsExportCapture', 'HS-Records', exportRecordsBtn);

      const exportFinanceBtn = e.target.closest('.export-finance-btn');
      if (exportFinanceBtn) exportImageFromElement('financeExportCapture', 'HS-Finance', exportFinanceBtn);

      const loadAttendanceBtn = e.target.closest('#loadAttendanceBtn');
      if (loadAttendanceBtn) {
        const text = document.getElementById('attendanceInput').value;
        const names = parseAttendanceNames(text);
        const result = matchAttendanceToProfiles(names);
        tmMatched = result.matched;
        tmUnmatchedNames = result.unmatched;
        tmSelected = new Set();
        tmLastResult = null;
        document.getElementById('tmResults').innerHTML = '';
        renderTeamManagerLists();
      }

      const assignBtn = e.target.closest('.tm-pos-btn');
      if (assignBtn) {
        const name = assignBtn.dataset.assignName;
        const pos = assignBtn.dataset.assignPos;
        const context = assignBtn.dataset.assignContext || 'tm';
        const defaults = DATA.positionDefaults || {};
        const template = defaults[pos];
        const assigned = Object.assign({}, template || {}, { name: name, position: pos, isDefaultAssigned: true });
        if (context === 'ld') {
          ldMatched.push(assigned);
          ldUnmatchedNames = ldUnmatchedNames.filter(function (n) { return n !== name; });
          renderLeagueDraftLists();
          updateLeagueDraftValidation();
        } else {
          tmMatched.push(assigned);
          tmUnmatchedNames = tmUnmatchedNames.filter(function (n) { return n !== name; });
          renderTeamManagerLists();
        }
      }

      const tile = e.target.closest('.tm-tile');
      if (tile && !tile.classList.contains('disabled')) {
        const name = tile.dataset.tileName;
        if (tmSelected.has(name)) {
          tmSelected.delete(name);
        } else if (tmSelected.size < 10) {
          tmSelected.add(name);
        }
        renderTeamManagerLists();
      }

      const assembleBtnEl = e.target.closest('#assembleBtn');
      if (assembleBtnEl && !assembleBtnEl.disabled) {
        const selectedPlayers = tmMatched.filter(function (p) { return tmSelected.has(p.name); });
        tmLastResult = assembleTeams(selectedPlayers);
        renderTeamResults(tmLastResult);
      }

      const loadRosterBtn = e.target.closest('#loadRosterBtn');
      if (loadRosterBtn) {
        const text = document.getElementById('ldRosterInput').value;
        const names = parseAttendanceNames(text);
        const result = matchAttendanceToProfiles(names);
        ldMatched = result.matched;
        ldUnmatchedNames = result.unmatched;
        ldLastResult = null;
        document.getElementById('ldResults').innerHTML = '';
        renderCreateLeagueSection();
        renderLeagueDraftLists();
        updateLeagueDraftValidation();
      }

      const ldAssembleBtnEl = e.target.closest('#ldAssembleBtn');
      if (ldAssembleBtnEl && !ldAssembleBtnEl.disabled) {
        const numTeams = parseInt(document.getElementById('ldNumTeams').value, 10);
        ldLastResult = assembleLeagueTeams(ldMatched, numTeams);
        renderLeagueTeamResults(ldLastResult);
      }

      const ldExportImageBtn = e.target.closest('#ldExportImageBtn');
      if (ldExportImageBtn) exportImageFromElement('ldExportCapture', 'HS-League-Draft', ldExportImageBtn);

      const ldCopyTeamListBtn = e.target.closest('#ldCopyTeamListBtn');
      if (ldCopyTeamListBtn) copyTeamList(ldCopyTeamListBtn);
    });

    // Live refresh: re-fetch (not a full page reload) every 15 minutes,
    // preserving whatever "As At" month is currently selected.
    setInterval(function () { loadData(currentMonthParam, currentRecordsMonthParam); }, 15 * 60 * 1000);
  </script>
</body>
</html>

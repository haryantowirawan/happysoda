<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Soda Loyalty Board</title>
  <style>
    :root {
      --bg: #17130f;
      --bg-2: #1f1912;
      --panel-solid: #241c14;
      --panel-2: #2c2318;
      --border: #3a2e20;
      --text: #f5ecdf;
      --muted: #a89478;
      --accent: #eed3b6;
      --accent-ink: #3a2c19;
      --gold: #ffcc4d;
      --silver: #d7cdbe;
      --bronze: #cd8a4d;
      --green: #7fd99a;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 500px at 50% -10%, #2c2115 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      padding: 28px 16px 60px;
    }
    .wrap { max-width: 900px; margin: 0 auto; }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 26px;
    }
    .logo {
      height: 92px;
      width: auto;
      margin-bottom: 10px;
      filter: drop-shadow(0 6px 18px rgba(238, 211, 182, 0.18));
    }
    h1 {
      font-size: 22px;
      margin: 2px 0 6px;
      letter-spacing: 0.01em;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    h1 .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      flex-shrink: 0;
    }
    h1 .dot.error { background: #e0715c; box-shadow: 0 0 8px #e0715c; }
    .meta {
      color: var(--muted);
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 14px;
    }
    .meta span { margin: 0 7px; }

    .warnings {
      background: #332512;
      border: 1px solid #5c4620;
      color: #f0cf98;
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 13px;
      margin: 14px 0;
      line-height: 1.5;
    }
    .warnings strong { display: block; margin-bottom: 4px; }
    .warnings.fatal {
      background: #3a1f1a;
      border-color: #6b3327;
      color: #f0b3a4;
    }

    body.light-mode {
      --bg: #f7f1e6;
      --panel-solid: #ffffff;
      --panel-2: #f0e6d2;
      --border: #e3d3b0;
      --text: #2c2013;
      --muted: #8a7455;
      --accent: #c9a267;
      --accent-ink: #ffffff;
      --gold: #b8860b;
      --silver: #8a8a8a;
      --bronze: #a56a35;
      --green: #2f9e57;
      background:
        radial-gradient(1200px 500px at 50% -10%, #fff6e6 0%, transparent 60%),
        var(--bg);
    }
    body.light-mode .warnings {
      background: #fff3d6;
      border-color: #e6c878;
      color: #7a5c12;
    }
    body.light-mode .warnings.fatal {
      background: #ffe8e3;
      border-color: #e3a99a;
      color: #a23c2a;
    }
    body.light-mode .badge.loyal { color: #3a4fa8; }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .asat-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--muted);
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
    }
    .asat-input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12.5px;
      font-family: inherit;
    }
    .asat-input:focus { outline: none; }
    .theme-toggle {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      line-height: 1.4;
    }
    .theme-toggle:hover { border-color: var(--accent); }

    .tabs {
      display: flex;
      gap: 6px;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      margin: 18px 0 16px;
      overflow-x: auto;
    }
    .tab {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .tab.active {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .tab .count {
      opacity: 0.75;
      margin-left: 4px;
      font-weight: 500;
    }

    .search {
      width: 100%;
      padding: 11px 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-solid);
      color: var(--text);
      font-size: 14px;
      margin-bottom: 14px;
    }
    .search:focus {
      outline: none;
      border-color: var(--accent);
    }
    .search::placeholder { color: var(--muted); }

    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.15s ease;
    }
    .card:hover { border-color: #5c4620; }

    .rank {
      width: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .rank.top1 { color: var(--gold); }
    .rank.top2 { color: var(--silver); }
    .rank.top3 { color: var(--bronze); }

    .card-main { flex: 1; min-width: 0; }
    .card-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge.hybrid { background: #24371f; color: var(--green); }
    .badge.loyal { background: #2a2f4a; color: #a8b9ee; }

    .card-reason {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.4;
    }
    .card-points {
      text-align: right;
      flex-shrink: 0;
    }
    .card-points .num {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
    }
    .card-points .label {
      font-size: 10.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 40px 20px;
      font-size: 14px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
    .table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel-solid); }
    .yes { color: var(--green); font-weight: 700; }
    .no { color: var(--muted); }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 30px;
      line-height: 1.6;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      font-size: 14px;
    }
  </style>
</head>

  <script>
    // ===================== CONFIGURATION =====================
    // Paste your Apps Script Web App URL here, ending in /exec
    // (same URL you'd normally share with players).
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzkY97F_zyPptOZvJrTsWlslDvE8mWA4iiSL0IRj_ajZo6Tez13iDY7lla3gTPIHv2c/exec';
    // ===========================================================

    let DATA = null;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function rankClass(i) {
      if (i === 0) return 'rank top1';
      if (i === 1) return 'rank top2';
      if (i === 2) return 'rank top3';
      return 'rank';
    }

    function renderMembers(list, filter) {
      const rows = list.filter(function (m) {
        return !filter || m.name.toLowerCase().includes(filter);
      });
      if (rows.length === 0) return '<div class="empty">No members match.</div>';
      return rows.map(function (m, i) {
        return '' +
          '<div class="card">' +
            '<div class="' + rankClass(i) + '">' + (i + 1) + '</div>' +
            '<div class="card-main">' +
              '<div class="card-name">' + esc(m.name) + '</div>' +
              '<div class="card-reason">' + esc(m.reason) + '</div>' +
            '</div>' +
            '<div class="card-points"><div class="num">' + m.points + '</div><div class="label">points</div></div>' +
          '</div>';
      }).join('');
    }

    function renderRegulars(list, filter) {
      const rows = list.filter(function (r) {
        return !filter || r.name.toLowerCase().includes(filter);
      });
      if (rows.length === 0) return '<div class="empty">Nobody here yet.</div>';
      return rows.map(function (r, i) {
        const catBadge = r.category === 'Hybrid'
          ? '<span class="badge hybrid">Hybrid</span>'
          : '<span class="badge loyal">Loyal</span>';
        return '' +
          '<div class="card">' +
            '<div class="' + rankClass(i) + '">' + (i + 1) + '</div>' +
            '<div class="card-main">' +
              '<div class="card-name">' + esc(r.name) + catBadge + '</div>' +
              '<div class="card-reason">' + esc(r.reason) + '</div>' +
            '</div>' +
            '<div class="card-points"><div class="num">' + r.points + '</div><div class="label">points</div></div>' +
          '</div>';
      }).join('');
    }

    function renderAll(list, filter) {
      const rows = list.filter(function (p) {
        return !filter || p.name.toLowerCase().includes(filter);
      });
      const cell = function (v) {
        return v === 'YES' ? '<span class="yes">YES</span>' : '<span class="no">NO</span>';
      };
      const body = rows.map(function (p) {
        return '<tr>' +
          '<td>' + esc(p.name) + '</td>' +
          '<td>' + p.paidMemberMonths + '</td>' +
          '<td>' + p.paidWeeklyVisits + '</td>' +
          '<td>' + p.weeklyEquivalentVisits + '</td>' +
          '<td>' + p.activeMonths + '</td>' +
          '<td>' + cell(p.recentActivity) + '</td>' +
          '<td>' + cell(p.memberEligible) + '</td>' +
          '<td>' + cell(p.regularEligible) + '</td>' +
          '<td>' + cell(p.semiRegularEligible) + '</td>' +
        '</tr>';
      }).join('');
      return '<div class="table-scroll"><table>' +
        '<thead><tr>' +
          '<th>Name</th><th>Member Mo.</th><th>Weekly Visits</th><th>Wkly-Equiv.</th>' +
          '<th>Active Mo.</th><th>Recent</th><th>Member?</th><th>Regular?</th><th>Semi?</th>' +
        '</tr></thead><tbody>' + body + '</tbody></table></div>';
    }

    function buildDashboard() {
      const content = document.getElementById('content');
      content.innerHTML =
        '<input class="search" id="searchBox" type="text" placeholder="Search a name…">' +
        '<div class="tabs">' +
          '<button class="tab active" data-panel="members">Members <span class="count" id="cnt-members"></span></button>' +
          '<button class="tab" data-panel="regular">Regular <span class="count" id="cnt-regular"></span></button>' +
          '<button class="tab" data-panel="semi">Semi-Regular <span class="count" id="cnt-semi"></span></button>' +
          '<button class="tab" data-panel="all">All Players <span class="count" id="cnt-all"></span></button>' +
        '</div>' +
        '<div class="panel active" id="panel-members"></div>' +
        '<div class="panel" id="panel-regular"></div>' +
        '<div class="panel" id="panel-semi"></div>' +
        '<div class="panel" id="panel-all"></div>';

      function renderAllPanels(filter) {
        document.getElementById('panel-members').innerHTML = renderMembers(DATA.members, filter);
        document.getElementById('panel-regular').innerHTML = renderRegulars(DATA.regular, filter);
        document.getElementById('panel-semi').innerHTML = renderRegulars(DATA.semiRegular, filter);
        document.getElementById('panel-all').innerHTML = renderAll(DATA.allPlayers, filter);
      }

      document.getElementById('cnt-members').textContent = DATA.members.length;
      document.getElementById('cnt-regular').textContent = DATA.regular.length;
      document.getElementById('cnt-semi').textContent = DATA.semiRegular.length;
      document.getElementById('cnt-all').textContent = DATA.allPlayers.length;

      renderAllPanels('');

      document.querySelectorAll('.tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
          document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
          document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
          tab.classList.add('active');
          document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
        });
      });

      document.getElementById('searchBox').addEventListener('input', function (e) {
        renderAllPanels(e.target.value.trim().toLowerCase());
      });
    }

    function showFatalError(message) {
      document.getElementById('statusDot').classList.add('error');
      document.getElementById('periodLabel').textContent = 'Could not load data';
      document.getElementById('content').innerHTML = '';
      document.getElementById('warningsBox').innerHTML =
        '<div class="warnings fatal"><strong>Something went wrong</strong>' + esc(message) + '</div>';
    }

    let currentMonthParam = null;

    function loadData(monthParam) {
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_') === 0) {
        showFatalError('APPS_SCRIPT_URL is not configured in this page yet.');
        return;
      }

      let url = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf('?') === -1 ? '?' : '&') + 'format=json';
      if (monthParam) url += '&month=' + encodeURIComponent(monthParam);

      fetch(url)
        .then(function (res) {
          if (!res.ok) throw new Error('Server responded with status ' + res.status);
          return res.json();
        })
        .then(function (json) {
          DATA = json;
          currentMonthParam = monthParam || null;
          document.getElementById('periodLabel').textContent =
            'Period ' + DATA.period.start + ' → ' + DATA.period.end;
          document.getElementById('updatedLabel').textContent =
            'Updated ' + new Date(DATA.generatedAt).toLocaleString();

          document.getElementById('asAtDate').value = DATA.period.end;

          if (DATA.warnings && DATA.warnings.length) {
            document.getElementById('warningsBox').innerHTML =
              '<div class="warnings"><strong>' + DATA.warnings.length + ' warning(s)</strong>' +
              DATA.warnings.map(esc).join('<br>') + '</div>';
          } else {
            document.getElementById('warningsBox').innerHTML = '';
          }

          if (DATA.sourcesUsed && DATA.sourcesUsed.length) {
            document.getElementById('footerLabel').textContent =
              'Auto-refreshes every 5 minutes · combining: ' + DATA.sourcesUsed.join(', ');
          } else {
            document.getElementById('footerLabel').textContent = 'Auto-refreshes every 5 minutes';
          }

          buildDashboard();
        })
        .catch(function (err) {
          showFatalError(
            'Could not reach the data source (' + err.message + '). ' +
            'If this keeps happening, check that APPS_SCRIPT_URL is correct and the Apps Script ' +
            'web app is deployed with "Who has access: Anyone".'
          );
        });
    }

    loadData();

    document.getElementById('asAtDate').addEventListener('change', function (e) {
      const ym = e.target.value; // 'YYYY-MM'
      if (!ym) return;
      loadData(ym);
    });

    const themeToggle = document.getElementById('themeToggle');
    const logoImg = document.getElementById('logoImg');
    themeToggle.addEventListener('click', function () {
      const isLight = document.body.classList.toggle('light-mode');
      themeToggle.textContent = isLight ? '🌙 Dark' : '☀️ Light';
      logoImg.src = isLight ? logoImg.dataset.light : logoImg.dataset.dark;
    });

    // Live refresh: re-fetch (not a full page reload) every 5 minutes,
    // preserving whatever "As At" month is currently selected.
    setInterval(function () { loadData(currentMonthParam); }, 5 * 60 * 1000);
  </script>
</body>
</html>

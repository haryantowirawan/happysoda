<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Soda - Home</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #17130f;
      --bg-2: #1f1912;
      --panel-solid: #241c14;
      --panel-2: #2c2318;
      --border: #3a2e20;
      --text: #f5ecdf;
      --muted: #a89478;
      --accent: #eed3b6;
      --accent-ink: #3a2c19;
      --gold: #ffcc4d;
      --silver: #d7cdbe;
      --bronze: #cd8a4d;
      --green: #7fd99a;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 500px at 50% -10%, #2c2115 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      padding: 28px 16px 60px;
    }
    .wrap { max-width: 900px; margin: 0 auto; }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 26px;
    }
    .logo {
      height: 92px;
      width: auto;
      margin-bottom: 10px;
      filter: drop-shadow(0 6px 18px rgba(238, 211, 182, 0.18));
    }
    h1 {
      font-size: 22px;
      margin: 2px 0 6px;
      letter-spacing: 0.01em;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    h1 .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      flex-shrink: 0;
    }
    h1 .dot.error { background: #e0715c; box-shadow: 0 0 8px #e0715c; }
    .meta {
      color: var(--muted);
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 14px;
    }
    .meta span { margin: 0 7px; }

    .warnings {
      background: #332512;
      border: 1px solid #5c4620;
      color: #f0cf98;
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 13px;
      margin: 14px 0;
      line-height: 1.5;
    }
    .warnings strong { display: block; margin-bottom: 4px; }
    .warnings.fatal {
      background: #3a1f1a;
      border-color: #6b3327;
      color: #f0b3a4;
    }

    body.light-mode {
      --bg: #f7f1e6;
      --panel-solid: #ffffff;
      --panel-2: #f0e6d2;
      --border: #e3d3b0;
      --text: #2c2013;
      --muted: #8a7455;
      --accent: #c9a267;
      --accent-ink: #ffffff;
      --gold: #b8860b;
      --silver: #8a8a8a;
      --bronze: #a56a35;
      --green: #2f9e57;
      background:
        radial-gradient(1200px 500px at 50% -10%, #fff6e6 0%, transparent 60%),
        var(--bg);
    }
    body.light-mode .warnings {
      background: #fff3d6;
      border-color: #e6c878;
      color: #7a5c12;
    }
    body.light-mode .warnings.fatal {
      background: #ffe8e3;
      border-color: #e3a99a;
      color: #a23c2a;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .asat-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--muted);
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
    }
    .asat-input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12.5px;
      font-family: inherit;
    }
    .asat-input:focus { outline: none; }
    .theme-toggle {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      line-height: 1.4;
    }
    .theme-toggle:hover { border-color: var(--accent); }

    .tabs {
      display: flex;
      gap: 6px;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      margin: 18px 0 16px;
      overflow-x: auto;
    }
    .tab {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .tab.active {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .tab .count {
      opacity: 0.75;
      margin-left: 4px;
      font-weight: 500;
    }

    .dashboard-period {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 14px;
    }

    .search {
      width: 100%;
      padding: 11px 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-solid);
      color: var(--text);
      font-size: 14px;
      margin-bottom: 14px;
    }
    .search:focus {
      outline: none;
      border-color: var(--accent);
    }
    .search::placeholder { color: var(--muted); }

    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn 0.2s ease; }
    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: #fff;
      font-size: 14px;
      z-index: 100;
    }
    .loading-overlay.show { display: flex; }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .records-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .records-export-title {
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      padding: 4px 0 12px;
      color: var(--text);
    }
    .records-panel { display: none; }
    .records-panel.active { display: block; }
    .paid-fee { color: var(--green); font-weight: 700; }
    .unpaid-fee { color: #e0715c; font-weight: 700; }
    #recordsExportCapture {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    body.exporting-records .records-panel {
      display: block !important;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .records-panel[data-export-label]::before {
      content: attr(data-export-label);
      display: block;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .hamburger-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      z-index: 60;
    }
    .hamburger-btn span {
      display: block;
      width: 18px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 55;
    }
    .menu-overlay.open { opacity: 1; pointer-events: auto; }

    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 240px;
      max-width: 78vw;
      background: var(--panel-solid);
      border-right: 1px solid var(--border);
      padding: 76px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 58;
    }
    .side-menu.open { transform: translateX(0); }
    .side-menu-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      padding: 11px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .side-menu-item.active { background: var(--accent); color: var(--accent-ink); }
    .side-menu-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 4px;
    }

    .about-card {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 18px;
      line-height: 1.6;
    }
    .about-photo {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 16px;
      display: block;
    }
    .about-card h2 { margin: 0 0 4px; font-size: 19px; }
    .about-tagline {
      color: var(--accent);
      font-weight: 700;
      margin: 0 0 14px;
      font-size: 13.5px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .about-card p { margin: 0 0 14px; font-size: 14px; color: var(--text); }
    .about-values {
      margin: 0 0 14px;
      padding-left: 20px;
      font-size: 14px;
    }
    .about-values li { margin-bottom: 6px; }
    .about-info-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      padding: 9px 0;
      border-top: 1px solid var(--border);
    }
    .about-icon { font-size: 17px; flex-shrink: 0; }
    .about-info-row a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .about-info-row a:hover { text-decoration: underline; }

    .trend-chart-wrap {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 8px 0;
      margin-bottom: 14px;
    }
    .trend-chart-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      padding: 2px 6px 10px;
    }
    .trend-chart {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 120px;
    }
    .trend-bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      min-width: 0;
    }
    .trend-bar {
      width: 100%;
      max-width: 20px;
      background: var(--accent);
      border-radius: 3px 3px 0 0;
      min-height: 3px;
    }
    .trend-bar-value {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .trend-bar-label {
      font-size: 9.5px;
      color: var(--muted);
      margin-top: 4px;
      white-space: nowrap;
    }

    .delta-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .delta-box {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .delta-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .delta-box.newcomer .delta-label { color: #5aa9e6; }
    .delta-subbox.comeback .delta-label { color: var(--green); }
    .delta-names {
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.5;
    }

    .delta-group {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .delta-group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .delta-group-row {
      display: flex;
      gap: 14px;
    }
    .delta-subbox {
      flex: 1;
      min-width: 0;
    }

    .export-btn {
      display: block;
      margin: 0 0 12px 0;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .export-btn:hover { border-color: var(--accent); }

    .balance-total {
      background: var(--panel-2);
      font-weight: 700;
    }
    .balance-total .card-name { color: var(--text); }

    .copyright {
      margin-top: 6px;
      font-size: 11px;
      opacity: 0.8;
    }

    .card {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.15s ease;
    }
    .card:hover { border-color: #5c4620; }

    .rank {
      width: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .rank.top1 { color: var(--gold); }
    .rank.top2 { color: var(--silver); }
    .rank.top3 { color: var(--bronze); }

    .card-main { flex: 1; min-width: 0; }
    .card-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge.hybrid { background: #24371f; color: #7fd99a; }
    .badge.loyal { background: #2a2f4a; color: #a8b9ee; }

    .card-reason {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.4;
    }
    .card-points {
      text-align: right;
      flex-shrink: 0;
    }
    .card-points .num {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
    }
    .card-points .label {
      font-size: 10.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 40px 20px;
      font-size: 14px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
    .table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel-solid); }
    .yes { color: var(--green); font-weight: 700; }
    .no { color: var(--muted); }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 30px;
      line-height: 1.6;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      font-size: 14px;
    }
  </style>
</head>

      <h1><span class="dot" id="statusDot"></span><span id="pageTitle">Loyalty Board</span></h1>
      <div class="meta">
        <span id="updatedLabel"></span>
      </div>
    </header>

    <div id="warningsBox"></div>

    <div id="content">
      <div class="loading">Loading the latest player data…</div>

  <script>
    // ===================== CONFIGURATION =====================
    // Paste your Apps Script Web App URL here, ending in /exec
    // (same URL you'd normally share with players).
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzkY97F_zyPptOZvJrTsWlslDvE8mWA4iiSL0IRj_ajZo6Tez13iDY7lla3gTPIHv2c/exec';
    // ===========================================================

    let DATA = null;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function rankClass(i) {
      if (i === 0) return 'rank top1';
      if (i === 1) return 'rank top2';
      if (i === 2) return 'rank top3';
      return 'rank';
    }

    function renderMembers(list, filter) {
      const rows = list.filter(function (m) {
        return !filter || m.name.toLowerCase().includes(filter);
      });
      if (rows.length === 0) return '<div class="empty">No members match.</div>';
      return rows.map(function (m, i) {
        return '' +
          '<div class="card">' +
            '<div class="' + rankClass(i) + '">' + (i + 1) + '</div>' +
            '<div class="card-main">' +
              '<div class="card-name">' + esc(m.name) + '</div>' +
              '<div class="card-reason">' + esc(m.reason) + '</div>' +
            '</div>' +
            '<div class="card-points"><div class="num">' + m.points + '</div><div class="label">points</div></div>' +
          '</div>';
      }).join('');
    }

    function renderRegulars(list, filter) {
      const rows = list.filter(function (r) {
        return !filter || r.name.toLowerCase().includes(filter);
      });
      if (rows.length === 0) return '<div class="empty">Nobody here yet.</div>';
      return rows.map(function (r, i) {
        const catBadge = r.category === 'Hybrid'
          ? '<span class="badge hybrid">Hybrid</span>'
          : '<span class="badge loyal">Loyal</span>';
        return '' +
          '<div class="card">' +
            '<div class="' + rankClass(i) + '">' + (i + 1) + '</div>' +
            '<div class="card-main">' +
              '<div class="card-name">' + esc(r.name) + catBadge + '</div>' +
              '<div class="card-reason">' + esc(r.reason) + '</div>' +
            '</div>' +
            '<div class="card-points"><div class="num">' + r.points + '</div><div class="label">points</div></div>' +
          '</div>';
      }).join('');
    }

    function renderAll(list, filter) {
      const rows = list.filter(function (p) {
        return !filter || p.name.toLowerCase().includes(filter);
      });
      const cell = function (v) {
        return v === 'YES' ? '<span class="yes">YES</span>' : '<span class="no">NO</span>';
      };
      const body = rows.map(function (p) {
        return '<tr>' +
          '<td>' + esc(p.name) + '</td>' +
          '<td>' + p.paidMemberMonths + '</td>' +
          '<td>' + p.paidWeeklyVisits + '</td>' +
          '<td>' + p.weeklyEquivalentVisits + '</td>' +
          '<td>' + p.activeMonths + '</td>' +
          '<td>' + cell(p.recentActivity) + '</td>' +
          '<td>' + cell(p.memberEligible) + '</td>' +
          '<td>' + cell(p.regularEligible) + '</td>' +
          '<td>' + cell(p.semiRegularEligible) + '</td>' +
        '</tr>';
      }).join('');
      return '<div class="table-scroll"><table>' +
        '<thead><tr>' +
          '<th>Name</th><th>Member Mo.</th><th>Weekly Visits</th><th>Wkly-Equiv.</th>' +
          '<th>Active Mo.</th><th>Recent</th><th>Member?</th><th>Regular?</th><th>Semi?</th>' +
        '</tr></thead><tbody>' + body + '</tbody></table></div>';
    }

    function formatIDR(n) {
      return 'Rp ' + Math.round(n).toLocaleString('id-ID');
    }

    function renderBalanceList(list, total, totalLabel, filter) {
      const rows = list.filter(function (item) {
        return !filter || item.name.toLowerCase().includes(filter);
      });
      if (rows.length === 0) return '<div class="empty">Nothing to show.</div>';
      const cards = rows.map(function (item, i) {
        return '' +
          '<div class="card">' +
            '<div class="' + rankClass(i) + '">' + (i + 1) + '</div>' +
            '<div class="card-main"><div class="card-name">' + esc(item.name) + '</div></div>' +
            '<div class="card-points"><div class="num">' + formatIDR(item.amount) + '</div></div>' +
          '</div>';
      }).join('');
      const totalCard =
        '<div class="card balance-total">' +
          '<div class="card-main"><div class="card-name">' + esc(totalLabel) + '</div></div>' +
          '<div class="card-points"><div class="num">' + formatIDR(total) + '</div></div>' +
        '</div>';
      return cards + totalCard;
    }

    function computePerksEligible() {
      const outstandingNames = new Set(
        (DATA.outstanding || []).map(function (o) { return o.name.trim().toLowerCase(); })
      );
      const fromMembers = (DATA.members || []).map(function (m) {
        return { name: m.name, tier: 'Member', points: m.points, reason: m.reason };
      });
      const fromRegulars = (DATA.regular || []).map(function (r) {
        return { name: r.name, tier: 'Regular', points: r.points, reason: r.reason };
      });
      return fromMembers.concat(fromRegulars).filter(function (p) {
        return !outstandingNames.has(p.name.trim().toLowerCase());
      });
    }

    function renderPerks(filter) {
      const list = computePerksEligible().sort(function (a, b) { return b.points - a.points; });
      const rows = list.filter(function (item) {
        return !filter || item.name.toLowerCase().includes(filter);
      });
      const exportBtn = '<button id="exportPerksBtn" class="export-btn" type="button">📋 Copy List</button>';
      if (rows.length === 0) return exportBtn + '<div class="empty">No one is eligible yet.</div>';
      const cards = rows.map(function (item, i) {
        const badge = item.tier === 'Member'
          ? '<span class="badge loyal">Member</span>'
          : '<span class="badge hybrid">Regular</span>';
        return '' +
          '<div class="card">' +
            '<div class="' + rankClass(i) + '">' + (i + 1) + '</div>' +
            '<div class="card-main">' +
              '<div class="card-name">' + esc(item.name) + badge + '</div>' +
              '<div class="card-reason">' + esc(item.reason) + '</div>' +
            '</div>' +
            '<div class="card-points"><div class="num">' + item.points + '</div><div class="label">points</div></div>' +
          '</div>';
      }).join('');
      return exportBtn + cards;
    }

    function formatMonthLabel(ym) {
      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const parts = ym.split('-');
      return monthNames[parseInt(parts[1], 10) - 1];
    }

    function renderRecordsTable(entries) {
      if (!entries || entries.length === 0) return '<div class="empty">No entries for this month.</div>';
      const rows = entries.map(function (entry, i) {
        const statusCell = entry.fee !== null
          ? '<span class="paid-fee">' + formatIDR(entry.fee) + '</span>'
          : '<span class="unpaid-fee">Not Paid</span>';
        return '' +
          '<tr>' +
            '<td>' + (i + 1) + '</td>' +
            '<td>' + esc(entry.name) + '</td>' +
            '<td>' + statusCell + '</td>' +
          '</tr>';
      }).join('');
      return '' +
        '<div class="table-scroll"><table>' +
          '<thead><tr><th>#</th><th>Name</th><th>Fee</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table></div>';
    }

    function renderRecordsPage() {
      const mr = DATA.monthlyRecords || { membership: [], week1: [], week2: [], week3: [], week4: [], week5: [] };
      const community = DATA.membershipReminderCommunity || 'HS';
      const monthLabel = DATA.recordsMonthLabelSeptStyle || DATA.recordsMonth || '';
      document.getElementById('recordsExportTitle').textContent = community + ' Records — ' + monthLabel;
      document.getElementById('recordspanel-membership').innerHTML = renderRecordsTable(mr.membership);
      document.getElementById('recordspanel-week1').innerHTML = renderRecordsTable(mr.week1);
      document.getElementById('recordspanel-week2').innerHTML = renderRecordsTable(mr.week2);
      document.getElementById('recordspanel-week3').innerHTML = renderRecordsTable(mr.week3);
      document.getElementById('recordspanel-week4').innerHTML = renderRecordsTable(mr.week4);
      document.getElementById('recordspanel-week5').innerHTML = renderRecordsTable(mr.week5);
      document.getElementById('recordsMonthPicker').value = DATA.recordsMonth || '';
    }

    function renderAttendanceChart() {
      const data = DATA.monthlyAttendance || [];
      if (data.length === 0) return '';
      const values = data.map(function (d) { return d.count; });
      const max = Math.max.apply(null, values) || 1;
      const min = Math.min.apply(null, values);
      const range = max - min;
      // Zoom the baseline so month-to-month differences are actually
      // visible even when values are clustered close together, instead of
      // every bar looking nearly full-height against a 0 baseline.
      const baseline = range > 0 ? Math.max(0, min - range * 0.3) : 0;
      const span = (max - baseline) || 1;

      const cols = data.map(function (d) {
        const pct = Math.max(Math.round(((d.count - baseline) / span) * 100), 4);
        return '' +
          '<div class="trend-bar-col">' +
            '<div class="trend-bar-value">' + d.count + '</div>' +
            '<div class="trend-bar" style="height:' + pct + '%"></div>' +
            '<div class="trend-bar-label">' + formatMonthLabel(d.month) + '</div>' +
          '</div>';
      }).join('');
      return '' +
        '<div class="trend-chart-wrap">' +
          '<div class="trend-chart-title">Active players per month</div>' +
          '<div class="trend-chart">' + cols + '</div>' +
        '</div>';
    }

    function renderDeltaRow() {
      const listOrNone = function (arr) {
        return (arr && arr.length) ? arr.map(esc).join(', ') : 'None';
      };
      const newcomers = DATA.newcomers || [];
      const comeback = DATA.comebackPlayers || [];
      const departed = DATA.departedPlayers || [];
      return '' +
        '<div class="delta-row">' +
          '<div class="delta-box newcomer">' +
            '<div class="delta-label">🌱 New &amp; Returning Players (' + newcomers.length + ')</div>' +
            '<div class="delta-names">' + listOrNone(newcomers) + '</div>' +
          '</div>' +
          '<div class="delta-group">' +
            '<div class="delta-group-title">Member/Regular Changes</div>' +
            '<div class="delta-group-row">' +
              '<div class="delta-subbox comeback">' +
                '<div class="delta-label">🆕 New (' + comeback.length + ')</div>' +
                '<div class="delta-names">' + listOrNone(comeback) + '</div>' +
              '</div>' +
              '<div class="delta-subbox departed">' +
                '<div class="delta-label">👋 Departed (' + departed.length + ')</div>' +
                '<div class="delta-names">' + listOrNone(departed) + '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
    }

    function buildDashboard() {
      document.getElementById('pageTitle').textContent = 'Loyalty Board';
      const content = document.getElementById('content');
      content.innerHTML =
        '<button id="menuToggle" class="hamburger-btn" type="button" aria-label="Open menu">' +
          '<span></span><span></span><span></span>' +
        '</button>' +
        '<div id="menuOverlay" class="menu-overlay"></div>' +
        '<nav id="sideMenu" class="side-menu">' +
          '<button class="side-menu-item active" data-page="dashboard">Dashboard</button>' +
          '<button class="side-menu-item" data-page="outstanding">Outstanding Payments</button>' +
          '<button class="side-menu-item" data-page="credits">Player Credits</button>' +

            '<h2>About Happy Soda</h2>' +

      document.getElementById('periodLabel').textContent =
        'Period ' + DATA.period.start + ' → ' + DATA.period.end;
      document.getElementById('attendanceChartContainer').innerHTML = renderAttendanceChart();
      document.getElementById('deltaRowContainer').innerHTML = renderDeltaRow();

      function renderAllPanels(filter) {
        document.getElementById('panel-members').innerHTML = renderMembers(DATA.members, filter);
        document.getElementById('panel-regular').innerHTML = renderRegulars(DATA.regular, filter);
        document.getElementById('panel-semi').innerHTML = renderRegulars(DATA.semiRegular, filter);
        document.getElementById('panel-perks').innerHTML = renderPerks(filter);
        document.getElementById('panel-all').innerHTML = renderAll(DATA.allPlayers, filter);
      }

      document.getElementById('cnt-members').textContent = DATA.members.length;
      document.getElementById('cnt-regular').textContent = DATA.regular.length;
      document.getElementById('cnt-semi').textContent = DATA.semiRegular.length;
      document.getElementById('cnt-perks').textContent = computePerksEligible().length;
      document.getElementById('cnt-all').textContent = DATA.allPlayers.length;

      renderAllPanels('');

      document.getElementById('page-outstanding-content').innerHTML =
        renderBalanceList(DATA.outstanding || [], DATA.outstandingTotal || 0, 'Total Outstanding', '');
      document.getElementById('page-credits-content').innerHTML =
        renderBalanceList(DATA.credits || [], DATA.creditsTotal || 0, 'Total Player Credits', '');
      document.getElementById('financeExportTitle').textContent =
        (DATA.membershipReminderCommunity || 'HS') + ' Outstanding & Player Credits — ' + (DATA.currentYear || '');
      document.getElementById('financeExportOutstanding').innerHTML =
        renderBalanceList(DATA.outstanding || [], DATA.outstandingTotal || 0, 'Total Outstanding', '');
      document.getElementById('financeExportCredits').innerHTML =
        renderBalanceList(DATA.credits || [], DATA.creditsTotal || 0, 'Total Player Credits', '');
      renderRecordsPage();

      document.querySelectorAll('#tierTabs .tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
          document.querySelectorAll('#tierTabs .tab').forEach(function (t) { t.classList.remove('active'); });
          document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
          tab.classList.add('active');
          document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
        });
      });

      document.querySelectorAll('#recordsTabs .tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
          document.querySelectorAll('#recordsTabs .tab').forEach(function (t) { t.classList.remove('active'); });
          document.querySelectorAll('.records-panel').forEach(function (p) { p.classList.remove('active'); });
          tab.classList.add('active');
          document.getElementById('recordspanel-' + tab.dataset.recordspanel).classList.add('active');
        });
      });

      document.getElementById('recordsMonthPicker').addEventListener('change', function (e) {
        const ym = e.target.value;
        if (!ym) return;
        document.getElementById('loadingOverlay').classList.add('show');
        loadData(undefined, ym);
      });

      const menuToggle = document.getElementById('menuToggle');
      const sideMenu = document.getElementById('sideMenu');
      const menuOverlay = document.getElementById('menuOverlay');

      function closeSideMenu() {
        sideMenu.classList.remove('open');
        menuOverlay.classList.remove('open');
      }
      function openSideMenu() {
        sideMenu.classList.add('open');
        menuOverlay.classList.add('open');
      }
      menuToggle.addEventListener('click', function () {
        if (sideMenu.classList.contains('open')) closeSideMenu(); else openSideMenu();
      });
      menuOverlay.addEventListener('click', closeSideMenu);

      const PAGE_TITLES = {
        dashboard: 'Loyalty Board',
        outstanding: 'Outstanding Payments',
        credits: 'Player Credits',
        records: 'Monthly Records',
        about: 'About Us',
      };

      document.querySelectorAll('.side-menu-item[data-page]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.side-menu-item[data-page]').forEach(function (t) { t.classList.remove('active'); });
          document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
          btn.classList.add('active');
          document.getElementById('page-' + btn.dataset.page).classList.add('active');
          document.getElementById('pageTitle').textContent = PAGE_TITLES[btn.dataset.page] || 'Loyalty Board';
          closeSideMenu();
        });
      });

      // "As At" month picker — lives inside the Dashboard page only.
      // Changing it re-fetches with a new ?month= (no full page reload),
      // preserved across auto-refreshes via currentMonthParam.
      document.getElementById('asAtDate').value = DATA.period.end;
      document.getElementById('asAtDate').addEventListener('change', function (e) {
        const ym = e.target.value; // 'YYYY-MM'
        if (!ym) return;
        document.getElementById('loadingOverlay').classList.add('show');
        loadData(ym);
      });

      // Dark/light toggle — now lives in the side menu as a settings-style
      // item; doesn't close the menu or navigate. Resets to dark on
      // reload (no persistence), consistent with the rest of the rebuild.
      document.getElementById('themeToggle').addEventListener('click', function () {
        const isLight = document.body.classList.toggle('light-mode');
        document.getElementById('themeToggle').textContent = isLight ? '🌙 Dark Mode' : '☀️ Light Mode';
        document.getElementById('logoImg').src = isLight
          ? document.getElementById('logoImg').dataset.light
          : document.getElementById('logoImg').dataset.dark;
      });

      document.getElementById('searchBox').addEventListener('input', function (e) {
        renderAllPanels(e.target.value.trim().toLowerCase());
      });
    }

    function showFatalError(message) {
      document.getElementById('statusDot').classList.add('error');
      document.getElementById('pageTitle').textContent = 'Could not load data';
      document.getElementById('content').innerHTML = '';
      document.getElementById('warningsBox').innerHTML =
        '<div class="warnings fatal"><strong>Something went wrong</strong>' + esc(message) + '</div>';
      document.getElementById('copyrightLabel').innerHTML =
        'Copyright © ' + new Date().getFullYear() + ' Happy Soda<br>Authored by: Haryanto Wirawan';
    }

    let currentMonthParam = null;
    let currentRecordsMonthParam = null;

    function loadData(monthParam, recordsMonthParam) {
      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_') === 0) {
        document.getElementById('loadingOverlay').classList.remove('show');
        showFatalError('APPS_SCRIPT_URL is not configured in this page yet.');
        return;
      }

      // Preserve whichever param wasn't explicitly passed this call, so
      // changing one month picker never resets the other.
      const effectiveMonth = monthParam !== undefined ? monthParam : currentMonthParam;
      const effectiveRecordsMonth = recordsMonthParam !== undefined ? recordsMonthParam : currentRecordsMonthParam;

      let url = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf('?') === -1 ? '?' : '&') + 'format=json';
      if (effectiveMonth) url += '&month=' + encodeURIComponent(effectiveMonth);
      if (effectiveRecordsMonth) url += '&recordsMonth=' + encodeURIComponent(effectiveRecordsMonth);

      fetch(url)
        .then(function (res) {
          if (!res.ok) throw new Error('Server responded with status ' + res.status);
          return res.json();
        })
        .then(function (json) {
          DATA = json;
          currentMonthParam = effectiveMonth || null;
          currentRecordsMonthParam = effectiveRecordsMonth || null;
          document.getElementById('updatedLabel').textContent =
            'Updated ' + new Date(DATA.generatedAt).toLocaleString();

          if (DATA.warnings && DATA.warnings.length) {
            document.getElementById('warningsBox').innerHTML =
              '<div class="warnings"><strong>' + DATA.warnings.length + ' warning(s)</strong>' +
              DATA.warnings.map(esc).join('<br>') + '</div>';
          } else {
            document.getElementById('warningsBox').innerHTML = '';
          }

          if (DATA.sourcesUsed && DATA.sourcesUsed.length) {
            document.getElementById('footerLabel').textContent =
              'Auto-refreshes every 15 minutes · ' + DATA.sourcesUsed.join(', ');
          } else {
            document.getElementById('footerLabel').textContent = 'Auto-refreshes every 15 minutes';
          }

          document.getElementById('copyrightLabel').innerHTML =
            'Copyright © ' + (DATA.currentYear || new Date().getFullYear()) + ' Happy Soda<br>Authored by: Haryanto Wirawan';

          buildDashboard();
          document.getElementById('loadingOverlay').classList.remove('show');
        })
        .catch(function (err) {
          document.getElementById('loadingOverlay').classList.remove('show');
          showFatalError(
            'Could not reach the data source (' + err.message + '). ' +
            'If this keeps happening, check that APPS_SCRIPT_URL is correct and the Apps Script ' +
            'web app is deployed with "Who has access: Anyone".'
          );
        });
    }

    loadData();

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(textarea);
      return ok;
    }

    function copyPerksList(btn) {
      const filterValue = document.getElementById('searchBox')
        ? document.getElementById('searchBox').value.trim().toLowerCase() : '';
      const list = computePerksEligible()
        .filter(function (item) { return !filterValue || item.name.toLowerCase().includes(filterValue); })
        .sort(function (a, b) { return b.points - a.points; });

      if (list.length === 0) {
        alert('No one is currently eligible to export.');
        return;
      }

      const lines = ['Perks Eligible members/regulars:', ''];
      list.forEach(function (item, i) { lines.push((i + 1) + '. ' + item.name); });
      const text = lines.join('\n');

      const showCopied = function () {
        const original = btn.textContent;
        btn.textContent = '✅ Copied!';
        setTimeout(function () { btn.textContent = original; }, 1500);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showCopied).catch(function () {
          if (fallbackCopy(text)) showCopied();
          else alert('Could not copy automatically. Here is the list:\n\n' + text);
        });
      } else {
        if (fallbackCopy(text)) showCopied();
        else alert('Could not copy automatically. Here is the list:\n\n' + text);
      }
    }

    function copyMembershipList(btn) {
      const roster = DATA.membershipRoster || [];
      if (roster.length === 0) {
        alert('No membership roster found for this month.');
        return;
      }
      const community = DATA.membershipReminderCommunity || 'HS';
      const monthLabel = DATA.recordsMonthLabelSeptStyle || DATA.recordsMonth || '';
      const reminderLines = DATA.membershipReminderLines || [];

      const lines = [];
      lines.push('List member ' + community + ' ' + monthLabel);
      reminderLines.forEach(function (l) { lines.push(l); });
      roster.forEach(function (m, i) {
        const check = m.paid ? '\u2705' : '';
        lines.push(' ' + (i + 1) + '.\u2060 \u2060' + check + m.name);
      });
      const text = lines.join('\n');

      const showCopied = function () {
        const original = btn.textContent;
        btn.textContent = '✅ Copied!';
        setTimeout(function () { btn.textContent = original; }, 1500);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(showCopied).catch(function () {
          if (fallbackCopy(text)) showCopied();
          else alert('Could not copy automatically. Here is the list:\n\n' + text);
        });
      } else {
        if (fallbackCopy(text)) showCopied();
        else alert('Could not copy automatically. Here is the list:\n\n' + text);
      }
    }

    function exportImageFromElement(elementId, filenamePrefix, btn) {
      if (typeof html2canvas === 'undefined') {
        alert('Image export library failed to load — check your internet connection and try again.');
        return;
      }
      const original = btn.textContent;
      btn.textContent = '⏳ Generating…';
      btn.disabled = true;
      document.body.classList.add('exporting-records');
      const target = document.getElementById(elementId);
      target.style.display = 'block';

      setTimeout(function () {
        html2canvas(target, { scale: 2 }).then(function (canvas) {
          document.body.classList.remove('exporting-records');
          if (elementId === 'financeExportCapture') target.style.display = 'none';
          btn.textContent = original;
          btn.disabled = false;
          const link = document.createElement('a');
          link.download = filenamePrefix + '-' + (DATA.recordsMonth || DATA.currentYear || 'export') + '.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        }).catch(function (err) {
          document.body.classList.remove('exporting-records');
          if (elementId === 'financeExportCapture') target.style.display = 'none';
          btn.textContent = original;
          btn.disabled = false;
          alert('Could not generate image: ' + err.message);
        });
      }, 50);
    }

    // Event delegation: works regardless of how many times these buttons
    // get recreated by buildDashboard() on every refresh.
    document.addEventListener('click', function (e) {
      const perksBtn = e.target.closest('#exportPerksBtn');
      if (perksBtn) copyPerksList(perksBtn);

      const copyMembershipBtn = e.target.closest('#copyMembershipListBtn');
      if (copyMembershipBtn) copyMembershipList(copyMembershipBtn);

      const exportRecordsBtn = e.target.closest('#exportRecordsImageBtn');
      if (exportRecordsBtn) exportImageFromElement('recordsExportCapture', 'HS-Records', exportRecordsBtn);

      const exportFinanceBtn = e.target.closest('.export-finance-btn');
      if (exportFinanceBtn) exportImageFromElement('financeExportCapture', 'HS-Finance', exportFinanceBtn);
    });

    // Live refresh: re-fetch (not a full page reload) every 15 minutes,
    // preserving whatever "As At" month is currently selected.
    setInterval(function () { loadData(currentMonthParam, currentRecordsMonthParam); }, 15 * 60 * 1000);
  </script>
</body>
</html>

  <!-- Open Graph tags so WhatsApp/etc. show a preview card when the site URL is pasted.
       og:image must be a plain fetchable URL (not a data: URI, which link-unfurlers won't
       fetch) — reuses the same team photo as the About Us page, exported to a real file. -->
  <meta property="og:title" content="Happy Soda Dashboard">
  <meta property="og:description" content="Loyalty tiers, payments, attendance, and team balancing for the Happy Soda community.">
  <meta property="og:image" content="https://happysoda.pages.dev/images/og-image-v2.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="800">
  <meta property="og:url" content="https://happysoda.pages.dev/">
  <meta property="og:type" content="website">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #17130f;
      --bg-2: #1f1912;
      --panel-solid: #241c14;
      --panel-2: #2c2318;
      --border: #3a2e20;
      --text: #f5ecdf;
      --muted: #a89478;
      --accent: #eed3b6;
      --accent-ink: #3a2c19;
      /* Deeper companion to --accent, for primary action buttons only
         (Assemble Teams / Create League) so they don't read as the same
         swatch as a selected Team Manager name tile, which uses --accent. */
      --action: #c17f36;
      --action-ink: #1c1409;
      --gold: #ffcc4d;
      --silver: #d7cdbe;
      --bronze: #cd8a4d;
      --green: #7fd99a;
      --red: #e0715c;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 500px at 50% -10%, #2c2115 0%, transparent 60%),
        var(--bg);
      color: var(--text);
      padding: 28px 16px 60px;
    }
    .wrap { max-width: 900px; margin: 0 auto; }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 26px;
    }
    .logo {
      height: 92px;
      width: auto;
      margin-bottom: 10px;
      filter: drop-shadow(0 6px 18px rgba(238, 211, 182, 0.18));
    }
    h1 {
      font-size: 22px;
      margin: 2px 0 6px;
      letter-spacing: 0.01em;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    h1 .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      flex-shrink: 0;
    }
    h1 .dot.error { background: #e0715c; box-shadow: 0 0 8px #e0715c; }
    .meta {
      color: var(--muted);
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 14px;
    }
    .meta span { margin: 0 7px; }

    .warnings {
      background: #332512;
      border: 1px solid #5c4620;
      color: #f0cf98;
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 13px;
      margin: 14px 0;
      line-height: 1.5;
    }
    .warnings strong { display: block; margin-bottom: 4px; }
    .warnings.fatal {
      background: #3a1f1a;
      border-color: #6b3327;
      color: #f0b3a4;
    }

    body.light-mode {
      --bg: #f7f1e6;
      --panel-solid: #ffffff;
      --panel-2: #f0e6d2;
      --border: #e3d3b0;
      --text: #2c2013;
      --muted: #8a7455;
      --accent: #c9a267;
      --accent-ink: #ffffff;
      --action: #96602a;
      --action-ink: #ffffff;
      --gold: #b8860b;
      --silver: #8a8a8a;
      --bronze: #a56a35;
      --green: #2f9e57;
      --red: #c0392b;
      background:
        radial-gradient(1200px 500px at 50% -10%, #fff6e6 0%, transparent 60%),
        var(--bg);
    }
    body.light-mode .warnings {
      background: #fff3d6;
      border-color: #e6c878;
      color: #7a5c12;
    }
    body.light-mode .warnings.fatal {
      background: #ffe8e3;
      border-color: #e3a99a;
      color: #a23c2a;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    #page-records .controls-row { margin-bottom: 18px; }
    .asat-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--muted);
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
    }
    .asat-input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 12.5px;
      font-family: inherit;
    }
    .asat-input:focus { outline: none; }
    .theme-toggle {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      line-height: 1.4;
    }
    .theme-toggle:hover { border-color: var(--accent); }

    .tabs {
      display: flex;
      gap: 6px;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px;
      margin: 18px 0 16px;
      overflow-x: auto;
    }
    .tab {
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .tab.active {
      background: var(--accent);
      color: var(--accent-ink);
    }
    .tab .count {
      opacity: 0.75;
      margin-left: 4px;
      font-weight: 500;
    }

    .dashboard-period {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 14px;
    }

    .search {
      width: 100%;
      padding: 11px 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-solid);
      color: var(--text);
      font-size: 14px;
      margin-bottom: 14px;
    }
    .search:focus {
      outline: none;
      border-color: var(--accent);
    }
    .search::placeholder { color: var(--muted); }

    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn 0.2s ease; }
    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: #fff;
      font-size: 14px;
      z-index: 100;
    }
    .loading-overlay.show { display: flex; }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tm-section { margin-bottom: 16px; }
    .tm-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .tm-textarea {
      width: 100%;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 10px;
      margin-bottom: 8px;
      resize: vertical;
    }
    .tm-unmatched-box {
      background: var(--panel-solid);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 14px;
      font-size: 12.5px;
    }
    .tm-unmatched-title {
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .tm-unmatched-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 0;
      border-top: 1px solid var(--border);
    }
    .tm-unmatched-row:first-child { border-top: none; }
    .tm-unmatched-name { font-weight: 600; color: var(--text); }
    .tm-pos-btns { display: flex; gap: 4px; flex-wrap: wrap; }
    .tm-pos-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .tm-pos-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tm-selection-header {
      margin-bottom: 12px;
    }
    .tm-selection-header span {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }
    .tm-assemble-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      color: var(--muted);
    }
    .tm-assemble-btn:disabled:hover { border-color: var(--border); }
    /* Primary-action tint — a deeper shade than --accent so Assemble Teams /
       Create League read as the primary action, distinct both from the
       neutral Export/Copy buttons below them and from a selected .tm-tile
       name box, which fills with --accent itself. */
    .tm-assemble-btn:not(:disabled) {
      background: var(--action);
      color: var(--action-ink);
      border-color: var(--action);
    }
    .tm-assemble-btn:not(:disabled):hover {
      opacity: 0.9;
      border-color: var(--action);
    }
    .tm-tile-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .tm-tile {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--panel-solid);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 6px;
      cursor: pointer;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .tm-tile-name {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }
    .tm-tile-position {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 3px;
    }
    .tm-tile.selected {
      border-color: var(--accent);
      background: var(--accent);
    }
    .tm-tile.selected .tm-tile-name,
    .tm-tile.selected .tm-tile-position { color: var(--accent-ink); }
    .tm-tile.disabled { opacity: 0.4; cursor: not-allowed; }
    .tm-tile-check {
      position: absolute;
      top: 3px;
      right: 5px;
      font-size: 11px;
    }
    .tm-tile-default-tag {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: 9px;
      color: var(--muted);
    }

    .tm-team-card {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }
    .tm-team-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .tm-team-rating {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .tm-team-player {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-top: 1px solid var(--border);
      font-size: 13.5px;
    }
    .tm-team-player:first-child { border-top: none; }
    .tm-team-player-pos { color: var(--muted); font-size: 12px; }
    .tm-fairness-note {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .ld-roster-summary {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 12.5px;
      color: var(--text);
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .ld-roster-summary strong { color: var(--muted); }
    .ld-validation-ok {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 14px;
      text-align: center;
    }
    .ld-validation-error {
      background: var(--panel-solid);
      border: 1px solid #e0715c;
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 13px;
      color: #e0715c;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .records-actions {
      display: flex;
      flex-direction: row;
      gap: 8px;
      margin-bottom: 14px;
    }
    .records-actions .export-btn {
      flex: 1;
      padding: 7px 8px;
      font-size: 11.5px;
      margin-bottom: 0;
    }
    #ldCreateLeagueSection {
      display: contents;
    }
    .records-export-title {
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      padding: 4px 0 12px;
      color: var(--text);
    }
    .records-panel { display: none; }
    .records-panel.active { display: block; }
    .paid-fee { color: var(--green); font-weight: 700; }
    .unpaid-fee { color: #e0715c; font-weight: 700; }
    /* Every export image is a bordered, rounded card sitting on an opaque
       gutter. html2canvas crops to the captured element's exact border box,
       so a border on the capture root itself lands in the image's outermost
       pixel row/column and reads as no border at all (and the rounded
       corners come out transparent). So the card is always the inner
       .export-card, and the capture roots only become the gutter during a
       capture — nothing about the on-screen pages changes. */
    .export-card {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }
    body.exporting-records #recordsExportCapture,
    body.exporting-records #ldExportCapture,
    body.exporting-records #financeExportCapture {
      background: var(--bg);
      padding: 16px;
    }
    body.exporting-records .records-panel {
      display: block !important;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    /* During export only, flow the sections into 3 balanced columns
       instead of stacking them — this uses the horizontal space that was
       going unused and cuts the image's height a long way, which helps a
       lot with WhatsApp's compression: very tall, extreme-aspect-ratio
       images get hit hardest by it.
       This is a multi-column flow, not a grid, on purpose. A 2-column
       grid pairs the sections off row by row, so every row was as tall as
       its taller section — a 21-name membership list beside a 6-name Week
       1 left ~15 rows of dead space, and an unused Week 5 wasted half a
       row. Columns instead pack the sections continuously and the browser
       balances the column heights itself, so the gaps disappear whatever
       shape the month happens to be. */
    body.exporting-records #recordsExportCapture .export-card {
      columns: 3;
      column-gap: 14px;
    }
    body.exporting-records #recordsExportTitle {
      column-span: all;
    }
    body.exporting-records #recordsExportCapture .records-panel {
      break-inside: avoid;
      margin-bottom: 14px;
      padding-bottom: 0;
      border-bottom: none;
      min-width: 0;
    }
    body.exporting-records #recordsExportCapture .records-panel[data-empty] {
      display: none !important;
    }
    .records-panel[data-export-label]::before {
      content: attr(data-export-label);
      display: block;
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 8px;
      color: var(--accent);
    }

    /* League Draft's export gets the same "2-column grid + widen during
       capture" treatment as Monthly Records, for the same reason — with
       4+ teams stacked vertically, the image gets tall enough to trigger
       WhatsApp's more aggressive compression. */
    body.exporting-records #ldExportCapture .export-card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
    }
    body.exporting-records #ldExportCapture .records-export-title,
    body.exporting-records #ldExportCapture .tm-fairness-note {
      grid-column: 1 / -1;
    }
    body.exporting-records #ldExportCapture .tm-team-card { margin-bottom: 0; }
    /* Type sizes for the exported image. The layout above stays 2-column
       at the full capture width on purpose — a single narrow column reads
       bigger on a phone, but the resulting tall image is exactly what
       WhatsApp's resize hits hardest, so the size comes from the type
       instead. What matters for legibility is font size RELATIVE to image
       width, since a phone scales the whole PNG to fit the screen: the
       original 15px inside a 732px-wide image landed at roughly 8px on a
       390px screen, and 23px lands at ~12px without changing the image's
       shape. Sizes stop here because the "N players · Total rating …" line
       starts wrapping in a half-width card past this. */
    body.exporting-records #ldExportCapture .tm-team-player {
      font-size: 23px;
      padding: 9px 0;
    }
    body.exporting-records #ldExportCapture .ld-jersey { font-size: 16px; min-width: 32px; }
    body.exporting-records #ldExportCapture .tm-team-player-pos { font-size: 19px; }
    body.exporting-records #ldExportCapture .tm-team-title { font-size: 24px; }
    body.exporting-records #ldExportCapture .tm-team-rating { font-size: 16px; }
    body.exporting-records #ldExportCapture .tm-fairness-note { font-size: 17px; }
    body.exporting-records #ldExportCapture .records-export-title { font-size: 23px; }

    .ld-jersey {
      display: inline-block;
      min-width: 26px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-right: 6px;
    }

    /* Fixed column widths so Name/Fee line up identically across every
       tab — without this, each table's columns auto-size to their own
       content, making the Fee column visibly jump left/right when
       switching tabs. */
    .records-data-table { table-layout: fixed; width: 100%; }
    .records-data-table th:nth-child(1), .records-data-table td:nth-child(1) { width: 10%; }
    .records-data-table th:nth-child(2), .records-data-table td:nth-child(2) { width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .records-data-table th:nth-child(3), .records-data-table td:nth-child(3) { width: 48%; text-align: right; white-space: nowrap; }
    /* Sizing for the exported image's 3 columns — narrower than the
       on-screen tab, so the padding tightens and the Name column gives up
       its ellipsis and wraps instead: a truncated "Teman Na…" in a saved
       image can't be expanded the way an on-screen one could be. */
    body.exporting-records .records-data-table { font-size: 13.5px; }
    body.exporting-records .records-data-table th,
    body.exporting-records .records-data-table td { padding: 7px 5px; }
    body.exporting-records .records-data-table th:nth-child(1),
    body.exporting-records .records-data-table td:nth-child(1) { width: 9%; }
    body.exporting-records .records-data-table th:nth-child(2),
    body.exporting-records .records-data-table td:nth-child(2) {
      width: 49%;
      white-space: normal;
      overflow: visible;
    }
    body.exporting-records .records-data-table th:nth-child(3),
    body.exporting-records .records-data-table td:nth-child(3) { width: 42%; }

    .finance-table { width: 100%; border-collapse: collapse; font-size: 16px; }
    .finance-table th {
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 6px;
      color: var(--muted);
      border-bottom: 2px solid var(--border);
    }
    .finance-table td {
      padding: 10px 6px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
    }
    .finance-table td.fin-name { font-weight: 600; color: var(--text); }
    .finance-table td.outstanding-cell { color: var(--red); text-align: right; white-space: nowrap; }
    .finance-table td.credit-cell { color: var(--green); text-align: right; white-space: nowrap; }
    .finance-table tr.fin-total-row td { border-bottom: none; padding-top: 12px; }

    .hamburger-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      z-index: 60;
    }
    .hamburger-btn span {
      display: block;
      width: 18px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 55;
    }
    .menu-overlay.open { opacity: 1; pointer-events: auto; }

    .side-menu {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 240px;
      max-width: 78vw;
      background: var(--panel-solid);
      border-right: 1px solid var(--border);
      padding: 76px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 58;
    }
    .side-menu.open { transform: translateX(0); }
    .side-menu-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      padding: 11px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .side-menu-item.active { background: var(--accent); color: var(--accent-ink); }
    .side-menu-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 4px;
    }

    .about-card {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 18px;
      line-height: 1.6;
    }
    .about-photo {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 16px;
      display: block;
    }
    .about-card h2 { margin: 0 0 4px; font-size: 19px; }
    .about-tagline {
      color: var(--accent);
      font-weight: 700;
      margin: 0 0 14px;
      font-size: 13.5px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .about-card p { margin: 0 0 14px; font-size: 14px; color: var(--text); }
    .about-values {
      margin: 0 0 14px;
      padding-left: 20px;
      font-size: 14px;
    }
    .about-values li { margin-bottom: 6px; }
    .about-info-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      padding: 9px 0;
      border-top: 1px solid var(--border);
    }
    .about-icon { font-size: 17px; flex-shrink: 0; }
    .about-info-row a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .about-info-row a:hover { text-decoration: underline; }

    .trend-chart-wrap {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 8px 0;
      margin-bottom: 14px;
    }
    .trend-chart-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      padding: 2px 6px 10px;
    }
    .trend-chart {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 120px;
    }
    .trend-bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      min-width: 0;
    }
    .trend-bar {
      width: 100%;
      max-width: 20px;
      background: var(--accent);
      border-radius: 3px 3px 0 0;
      min-height: 3px;
    }
    .trend-bar-value {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .trend-bar-label {
      font-size: 9.5px;
      color: var(--muted);
      margin-top: 4px;
      white-space: nowrap;
    }

    .il-empty {
      color: var(--muted);
      font-size: 13px;
      padding: 14px 4px;
      text-align: center;
    }
    .il-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      margin: 14px 0 6px;
    }
    /* Page-level headings ("Active League", "Archive") — bigger and in
       the main text color, distinct from the small muted subsection
       labels (Teams/Standings/Games) that .il-section-title is for. */
    .il-page-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--text);
      margin: 4px 0 12px;
    }
    .il-league-block {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 10px;
    }
    .il-league-header h3 {
      margin: 0 0 2px;
      font-size: 16px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .il-league-meta {
      color: var(--muted);
      font-size: 12px;
    }
    .il-status-badge {
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--panel-2);
      color: var(--muted);
    }
    .il-status-active {
      background: var(--green);
      color: #0d2b17;
    }
    .il-winner-banner {
      background: var(--panel-2);
      border-radius: 10px;
      padding: 8px 12px;
      margin: 8px 0;
      font-weight: 700;
      color: var(--gold);
    }
    .il-team-row {
      font-size: 13px;
      padding: 4px 0;
      border-bottom: 1px dashed var(--border);
    }
    .il-table-wrap {
      overflow-x: auto;
      margin-bottom: 12px;
    }
    .il-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    .il-table th, .il-table td {
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .il-vs {
      color: var(--muted);
      font-size: 11px;
    }
    .il-form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      padding: 8px 0;
    }
    .il-form-grid label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 11px;
      color: var(--muted);
    }
    .il-form-grid input, .il-form-grid select {
      font-size: 13px;
      padding: 5px 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
    }
    .il-checkbox {
      flex-direction: row !important;
      align-items: center;
      gap: 6px !important;
    }
    .il-add-game-box {
      background: var(--panel-2);
      border-radius: 10px;
      padding: 8px 10px;
      margin-top: 8px;
    }
    .il-archive-year {
      margin-bottom: 6px;
    }
    .il-archive-item {
      margin-bottom: 6px;
    }
    .il-archive-item summary {
      cursor: pointer;
      padding: 8px 10px;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
    }
    .il-danger-btn {
      border-color: #c0392b !important;
      color: #c0392b !important;
    }
    /* Bare icon buttons sitting inline in the league title row. */
    .il-rename-btn,
    .il-share-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      padding: 0 2px;
      opacity: 0.7;
    }
    .il-rename-btn:hover,
    .il-share-btn:hover { opacity: 1; }
    /* Share is the one control here every viewer gets (rename is
       admin-only), and it's tapped on a phone — give it a bigger glyph
       and a wider hit area than the rename pencil beside it. */
    .il-share-btn {
      font-size: 16px;
      padding: 2px 6px;
      opacity: 0.85;
    }
    .il-rename-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .il-rename-wrap input {
      font-size: 14px;
      font-weight: 700;
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
    }
    .il-rename-wrap .export-btn {
      padding: 4px 8px;
      font-size: 11px;
      margin-bottom: 0;
    }

    .delta-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .delta-box {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .delta-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .delta-box.newcomer .delta-label { color: #5aa9e6; }
    .delta-subbox.comeback .delta-label { color: var(--green); }
    .delta-names {
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.5;
    }

    .delta-group {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .delta-group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .delta-group-row {
      display: flex;
      gap: 14px;
    }
    .delta-subbox {
      flex: 1;
      min-width: 0;
    }

    .export-btn {
      display: block;
      margin: 0 0 12px 0;
      background: var(--panel-solid);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .export-btn:hover { border-color: var(--accent); }

    .balance-total {
      background: var(--panel-2);
      font-weight: 700;
    }
    .balance-total .card-name { color: var(--text); }

    .copyright {
      margin-top: 6px;
      font-size: 11px;
      opacity: 0.8;
    }

    .card {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.15s ease;
    }
    .card:hover { border-color: #5c4620; }

    .rank {
      width: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .rank.top1 { color: var(--gold); }
    .rank.top2 { color: var(--silver); }
    .rank.top3 { color: var(--bronze); }

    .card-main { flex: 1; min-width: 0; }
    .card-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge.hybrid { background: #24371f; color: #7fd99a; }
    .badge.loyal { background: #2a2f4a; color: #a8b9ee; }

    .card-reason {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.4;
    }
    .card-points {
      text-align: right;
      flex-shrink: 0;
    }
    .card-points .num {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
    }
    /* Outstanding = money owed (red), Player Credits = money in hand (green). */
    .card-points .num.amount-owed { color: var(--red); }
    .card-points .num.amount-credit { color: var(--green); }
    /* A currency amount is a long string, not a 2-digit point count — left at
       the .num size (20px/800) it dwarfs the 15px name beside it, so the two
       fee lists size their amount to sit with the name instead. */
    .card-points .num.amount-owed,
    .card-points .num.amount-credit {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }
    /* These cards are a single line (no reason/label under either side), so the
       name's second-line spacing would just push it off-center from the fee. */
    .balance-card .card-name { margin-bottom: 0; }
    .card-points .label {
      font-size: 10.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 40px 20px;
      font-size: 14px;
    }

    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
    .table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel-solid); }
    .yes { color: var(--green); font-weight: 700; }
    .no { color: var(--muted); }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 30px;
      line-height: 1.6;
    }

    /* First-load progress bar, shown inside #content until the initial
       loadData() resolves — see the matching #initialLoadOverlay in
       ../app-script-backend/ui.html (mirrored here per that repo's
       CLAUDE.md, since this isn't shared-logic-mechanism code). Unlike
       ui.html's version this isn't full-screen: the header/logo already
       render immediately since this is a static page, only #content
       itself was showing a placeholder. */
    .initial-load-progress {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 60px 20px;
    }
    .initial-progress-track {
      width: 220px;
      height: 6px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .initial-progress-fill {
      height: 100%;
      width: 4%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.4s ease;
    }
    .initial-load-text {
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>

      <div class="meta">
        <span id="updatedLabel"></span>
      </div>
    </header>

    <div id="warningsBox"></div>

    <div id="content">
      <div class="initial-load-progress">
        <div class="initial-progress-track"><div id="initialProgressFill" class="initial-progress-fill"></div></div>
        <div id="initialLoadText" class="initial-load-text">Loading the latest player data…</div>
      </div>
    </div>

    <footer id="footerLabel"></footer>
    <footer id="copyrightLabel" class="copyright"></footer>
  </div>

  <script>
    // ===================== CONFIGURATION =====================
    // Paste your Apps Script Web App URL here, ending in /exec
    // (same URL you'd normally share with players).
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzkY97F_zyPptOZvJrTsWlslDvE8mWA4iiSL0IRj_ajZo6Tez13iDY7lla3gTPIHv2c/exec';
    // ===========================================================

    let DATA = null;
    // Tracks whichever page is currently visible, so a rebuild triggered
    // by a month-picker change (via loadData -> buildDashboard) can
    // restore the same page instead of always landing back on Dashboard.
    let currentPage = 'dashboard';

    // Team Manager state — kept at top level (not reset by buildDashboard)
    // so an in-progress team-picking session survives the 15-minute
    // auto-refresh rebuild instead of silently losing selections.
    let tmMatched = [];
    let tmUnmatchedNames = [];
    let tmSelected = new Set();
    let tmLastResult = null;

    // League Draft state — same top-level persistence rationale as above.
    let ldMatched = [];
    let ldUnmatchedNames = [];
    let ldLastResult = null;
    let ldNumTeamsValue = 4;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function rankClass(i) {
      if (i === 0) return 'rank top1';
      if (i === 1) return 'rank top2';
      if (i === 2) return 'rank top3';
      return 'rank';
    }

    function renderMembers(list, filter) {
      const rows = list.filter(function (m) {
        return !filter || m.name.toLowerCase().includes(filter);
      });
      if (rows.length === 0) return '<div class="empty">No members match.</div>';
      return rows.map(function (m, i) {
        return '' +
          '<div class="card">' +
            '<div class="' + rankClass(i) + '">' + (i + 1) + '</div>' +
            '<div class="card-main">' +
              '<div class="card-name">' + esc(m.name) + '</div>' +
              '<div class="card-reason">' + esc(m.reason) + '</div>' +
            '</div>' +
            '<div class="card-points"><div class="num">' + m.points + '</div><div class="label">points</div></div>' +
          '</div>';
      }).join('');
    }

    function renderRegulars(list, filter) {
      const rows = list.filter(function (r) {
        return !filter || r.name.toLowerCase().includes(filter);
      });
      if (rows.length === 0) return '<div class="empty">Nobody here yet.</div>';
      return rows.map(function (r, i) {
        const catBadge = r.category === 'Hybrid'
          ? '<span class="badge hybrid">Hybrid</span>'
          : '<span class="badge loyal">Loyal</span>';
        return '' +
          '<div class="card">' +
            '<div class="' + rankClass(i) + '">' + (i + 1) + '</div>' +
            '<div class="card-main">' +
              '<div class="card-name">' + catBadge + esc(r.name) + '</div>' +
              '<div class="card-reason">' + esc(r.reason) + '</div>' +
            '</div>' +
            '<div class="card-points"><div class="num">' + r.points + '</div><div class="label">points</div></div>' +
          '</div>';
      }).join('');
    }

    function renderAll(list, filter) {
      const rows = list.filter(function (p) {
        return !filter || p.name.toLowerCase().includes(filter);
      });
      const cell = function (v) {
        return v === 'YES' ? '<span class="yes">YES</span>' : '<span class="no">NO</span>';
      };
      const body = rows.map(function (p) {
        return '<tr>' +
          '<td>' + esc(p.name) + '</td>' +
          '<td>' + p.paidMemberMonths + '</td>' +
          '<td>' + p.paidWeeklyVisits + '</td>' +
          '<td>' + p.weeklyEquivalentVisits + '</td>' +
          '<td>' + p.activeMonths + '</td>' +
          '<td>' + cell(p.recentActivity) + '</td>' +
          '<td>' + cell(p.memberEligible) + '</td>' +
          '<td>' + cell(p.regularEligible) + '</td>' +
          '<td>' + cell(p.semiRegularEligible) + '</td>' +
        '</tr>';
      }).join('');
      return '<div class="table-scroll"><table>' +
        '<thead><tr>' +
          '<th>Name</th><th>Member Mo.</th><th>Weekly Visits</th><th>Wkly-Equiv.</th>' +
          '<th>Active Mo.</th><th>Recent</th><th>Member?</th><th>Regular?</th><th>Semi?</th>' +
        '</tr></thead><tbody>' + body + '</tbody></table></div>';
    }

    function formatIDR(n) {
      return 'Rp ' + Math.round(n).toLocaleString('id-ID');
    }

    // amountClass tints the fee column: 'amount-owed' (red) or 'amount-credit' (green).
    function renderBalanceList(list, total, totalLabel, filter, amountClass) {
      const numClass = 'num' + (amountClass ? ' ' + amountClass : '');
      const rows = list.filter(function (item) {
        return !filter || item.name.toLowerCase().includes(filter);
      });
      if (rows.length === 0) return '<div class="empty">Nothing to show.</div>';
      const cards = rows.map(function (item, i) {
        return '' +
          '<div class="card balance-card">' +
            '<div class="' + rankClass(i) + '">' + (i + 1) + '</div>' +
            '<div class="card-main"><div class="card-name">' + esc(item.name) + '</div></div>' +
            '<div class="card-points"><div class="' + numClass + '">' + formatIDR(item.amount) + '</div></div>' +
          '</div>';
      }).join('');
      const totalCard =
        '<div class="card balance-card balance-total">' +
          '<div class="card-main"><div class="card-name">' + esc(totalLabel) + '</div></div>' +
          '<div class="card-points"><div class="' + numClass + '">' + formatIDR(total) + '</div></div>' +
        '</div>';
      return cards + totalCard;
    }

    function renderFinanceSideBySide(outstanding, outstandingTotal, credits, creditsTotal) {
      const maxLen = Math.max(outstanding.length, credits.length);
      let rows = '';
      for (let i = 0; i < maxLen; i++) {
        const o = outstanding[i];
        const c = credits[i];
        rows += '' +
          '<tr>' +
            '<td class="fin-name">' + (o ? esc(o.name) : '') + '</td>' +
            '<td class="outstanding-cell">' + (o ? formatIDR(o.amount) : '') + '</td>' +
            '<td class="fin-name">' + (c ? esc(c.name) : '') + '</td>' +
            '<td class="credit-cell">' + (c ? formatIDR(c.amount) : '') + '</td>' +
          '</tr>';
      }
      rows += '' +
        '<tr class="fin-total-row">' +
          '<td class="fin-name">Total</td>' +
          '<td class="outstanding-cell">' + formatIDR(outstandingTotal) + '</td>' +
          '<td class="fin-name">Total</td>' +
          '<td class="credit-cell">' + formatIDR(creditsTotal) + '</td>' +
        '</tr>';
      return '' +
        '<table class="finance-table">' +
          '<thead><tr><th colspan="2">Outstanding</th><th colspan="2">Player Credits</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>';
    }

    function computePerksEligible() {
      const outstandingNames = new Set(
        (DATA.outstanding || []).map(function (o) { return o.name.trim().toLowerCase(); })
      );
      const fromMembers = (DATA.members || []).map(function (m) {
        return { name: m.name, tier: 'Member', points: m.points, reason: m.reason };
      });
      const fromRegulars = (DATA.regular || []).map(function (r) {
        return { name: r.name, tier: 'Regular', points: r.points, reason: r.reason };
      });
      return fromMembers.concat(fromRegulars).filter(function (p) {
        return !outstandingNames.has(p.name.trim().toLowerCase());
      });
    }

    function renderPerks(filter) {
      const list = computePerksEligible().sort(function (a, b) { return b.points - a.points; });
      const rows = list.filter(function (item) {
        return !filter || item.name.toLowerCase().includes(filter);
      });
      const exportBtn = '<button id="exportPerksBtn" class="export-btn" type="button">📋 Copy List</button>';
      if (rows.length === 0) return exportBtn + '<div class="empty">No one is eligible yet.</div>';
      const cards = rows.map(function (item, i) {
        const badge = item.tier === 'Member'
          ? '<span class="badge loyal">Member</span>'
          : '<span class="badge hybrid">Regular</span>';
        return '' +
          '<div class="card">' +
            '<div class="' + rankClass(i) + '">' + (i + 1) + '</div>' +
            '<div class="card-main">' +
              '<div class="card-name">' + badge + esc(item.name) + '</div>' +
              '<div class="card-reason">' + esc(item.reason) + '</div>' +
            '</div>' +
            '<div class="card-points"><div class="num">' + item.points + '</div><div class="label">points</div></div>' +
          '</div>';
      }).join('');
      return exportBtn + cards;
    }

    function formatMonthLabel(ym) {
      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const parts = ym.split('-');
      return monthNames[parseInt(parts[1], 10) - 1];
    }

    // Matches the sheets' own writing convention (e.g. "Sept 2026", not
    // "Sep 2026" or "September 2026") — used for the Period line.
    function formatMonthSeptStyle(ym) {
      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sept', 'Oct', 'Nov', 'Dec'];
      const parts = ym.split('-');
      return monthNames[parseInt(parts[1], 10) - 1] + ' ' + parts[0];
    }

    // Explicit dd/mm/yyyy formatting — Date.prototype.toLocaleString()
    // depends on the viewer's browser locale, which could silently show
    // mm/dd/yyyy for some players. This guarantees the same format for
    // everyone, matching how dates are normally written locally.
    function formatUpdatedTime(date) {
      const day = date.getDate();
      const month = date.getMonth() + 1;
      const year = date.getFullYear();
      let hours = date.getHours();
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      if (hours === 0) hours = 12;
      return day + '/' + month + '/' + year + ', ' + hours + ':' + minutes + ':' + seconds + ' ' + ampm;
    }

    function renderRecordsTable(entries) {
      if (!entries || entries.length === 0) return '<div class="empty">No entries for this month.</div>';
      const rows = entries.map(function (entry, i) {
        const statusCell = entry.fee !== null
          ? '<span class="paid-fee">' + formatIDR(entry.fee) + '</span>'
          : '<span class="unpaid-fee">Not Paid</span>';
        return '' +
          '<tr>' +
            '<td>' + (i + 1) + '</td>' +
            '<td>' + esc(entry.name) + '</td>' +
            '<td>' + statusCell + '</td>' +
          '</tr>';
      }).join('');
      return '' +
        '<div class="table-scroll"><table class="records-data-table">' +
          '<thead><tr><th>#</th><th>Name</th><th>Fee</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table></div>';
    }

    // data-empty marks a week with no entries at all. On screen that tab
    // still shows its "No entries for this month." message; in the export
    // image the panel is dropped entirely, so an unused Week 5 doesn't
    // take up a whole column of empty space.
    function fillRecordsPanel(id, entries) {
      const el = document.getElementById(id);
      el.innerHTML = renderRecordsTable(entries);
      if (entries && entries.length) el.removeAttribute('data-empty');
      else el.setAttribute('data-empty', '1');
    }

    function renderRecordsPage() {
      const mr = DATA.monthlyRecords || { membership: [], week1: [], week2: [], week3: [], week4: [], week5: [] };

      const monthLabel = DATA.recordsMonthLabelSeptStyle || DATA.recordsMonth || '';
      document.getElementById('recordsExportTitle').textContent = community + ' Records — ' + monthLabel;
      fillRecordsPanel('recordspanel-membership', mr.membership);
      fillRecordsPanel('recordspanel-week1', mr.week1);
      fillRecordsPanel('recordspanel-week2', mr.week2);
      fillRecordsPanel('recordspanel-week3', mr.week3);
      fillRecordsPanel('recordspanel-week4', mr.week4);
      fillRecordsPanel('recordspanel-week5', mr.week5);
      document.getElementById('recordsMonthPicker').value = DATA.recordsMonth || '';
    }

    // ===================== Team Manager =====================
    const POSITIONS = ['PG', 'SG', 'SF', 'PF', 'C'];

    // SHARED-LOGIC:attendance-parsing:START (generated from shared/draft-logic.js — do not edit here; run node scripts/sync-shared.js)
    function parseAttendanceNames(text) {
      return text.split('\n')
        .map(function (line) {
          let cleaned = line;
          // Strip leading numbering ("1.", "12.") — allowing the
          // invisible word-joiner characters our own "Copy Membership
          // List" export uses.
          cleaned = cleaned.replace(/^\s*\d+[.)]\s*[\u2060]*\s*/, '');
          // "[OFF] Substitute" notation: whoever is named after
          // [OFF]/(OFF) is the real attendee, replacing whoever was
          // listed before it. If nothing follows (no substitute given),
          // the whole line is dropped — that slot simply isn't filled.
          const offMatch = /[\[(]\s*off\s*[\])]\s*(.*)$/i.exec(cleaned);
          if (offMatch) cleaned = offMatch[1];
          // Strip leading status markers — several real-world checkmark
          // styles (✅ ☑️ ✔️ ✓), a leading "-" or bullet, and any
          // invisible characters mixed in with them.
          cleaned = cleaned.replace(/^[\s\u2060\u2705\u2611\u2713\u2714\uFE0F\-•*]+/, '');
          return cleaned.trim();
        })
        .filter(function (name) { return name.length > 0; });
    }

    function matchAttendanceToProfiles(names) {
      const byLowerName = {};
      (DATA.playerProfiles || []).forEach(function (p) { byLowerName[p.name.toLowerCase()] = p; });

      const matched = [];
      const unmatched = [];
      const seen = new Set();
      names.forEach(function (name) {
        const key = name.toLowerCase();
        if (seen.has(key)) return; // dedupe repeated names in the paste
        seen.add(key);
        const profile = byLowerName[key];
        if (profile) {
          matched.push(profile);
        } else {
          unmatched.push(name);
        }
      });
      return { matched: matched, unmatched: unmatched };
    }
    // SHARED-LOGIC:attendance-parsing:END

    function renderTeamManagerLists() {
      const unmatchedBox = document.getElementById('tmUnmatchedSection');
      if (!unmatchedBox) return; // page not built yet on first load
      if (tmUnmatchedNames.length === 0) {

          return '' +
            '<div class="' + classes + '" data-tile-name="' + esc(p.name) + '">' +
              (isSelected ? '<span class="tm-tile-check">✅</span>' : '') +
              (p.isDefaultAssigned ? '<span class="tm-tile-default-tag">default</span>' : '') +
              '<div class="tm-tile-name">' + esc(p.name) + '</div>' +

    }

    // SHARED-LOGIC:team-manager-algorithm:START (generated from shared/draft-logic.js — do not edit here; run node scripts/sync-shared.js)
    // impact's raw scale (-1..5, players who "don't know how to play at
    // all" score negative) is already narrower than skillLevel/
    // athleticism/defense's ~0..9 — and it's the stat that most directly
    // captures how much a player actually swings a real game, good or
    // bad, so it's weighted UP (x2) rather than halved: at x2 its ~12-point
    // swing outweighs any single one of the other stats below, making it
    // the single biggest factor in the composite rating.
    function computeCompositeRating(p) {
      const ts = (p.trueShootingPct !== null && p.trueShootingPct !== undefined ? p.trueShootingPct : 50) / 10;
      const impact = (p.impact || 0) * 2;
      return (p.skillLevel || 5) + ts + impact + (p.athleticism || 5) + (p.defense || 5);
    }

    function isBigPosition(pos) { return pos === 'C' || pos === 'PF'; }

    // The 3 non-scoring roles a functional team needs at least one of —
    // Scorer/Shooter/Hustle are already well-reflected by the composite
    // rating above, so they don't need a separate coverage check here.
    const KEY_ROLES = ['Playmaker', 'Rebounder', 'Defender'];

    function playerRoles(p) {
      const roles = [];
      if (p.primaryRole) roles.push(p.primaryRole);
      if (p.secondaryRole) roles.push(p.secondaryRole);
      return roles;
    }

    // A player who can credibly run point: an actual PG, or anyone
    // carrying Playmaker as a primary/secondary role.
    function isPlaymakingCapable(p) {
      return p.position === 'PG' || playerRoles(p).indexOf('Playmaker') !== -1;
    }

    // A player who can credibly anchor the paint: an actual Center, or —
    // the fallback the coach philosophy calls for when there aren't
    // enough Centers to go around — a PF who is either tagged Rebounder
    // (primary/secondary role) or taller than the average of all
    // C/PF players in the pool (`tallThreshold`, computed by the caller
    // from the whole player set so "good height" is relative to this
    // group, not a hardcoded number).
    function hasRimPresence(p, tallThreshold) {
      if (p.position === 'C') return true;
      if (p.position === 'PF') {
        if (playerRoles(p).indexOf('Rebounder') !== -1) return true;
        if (tallThreshold != null && (p.heightCm || 0) >= tallThreshold) return true;
      }
      return false;
    }

    function averageBigHeight(players) {
      const bigs = players.filter(function (p) { return isBigPosition(p.position); });
      if (bigs.length === 0) return null;
      return bigs.reduce(function (s, p) { return s + (p.heightCm || 175); }, 0) / bigs.length;
    }

    // Penalizes any team with ZERO players matching `pred`, but only when
    // there are enough matching players across the whole draft pool to
    // give every team at least one — e.g. don't penalize a team for
    // having no Center if there are only 2 Centers total across 4 teams,
    // since that's simply not achievable. This is what turns "a team
    // should have at least 1 Center if possible" into an actual scoring
    // term: it's a strong, not absolute, preference — the fairest split
    // among 126 (or the local-search result) will very rarely leave a
    // gap when one wasn't necessary.
    function coverageGapPenalty(teams, pred, penaltyEach) {
      const counts = teams.map(function (team) { return team.filter(pred).length; });
      const total = counts.reduce(function (a, b) { return a + b; }, 0);
      if (total < teams.length) return 0;
      let penalty = 0;
      counts.forEach(function (c) { if (c === 0) penalty += penaltyEach; });
      return penalty;
    }

    // A team's combined strength of its 2 best players by composite
    // rating — same "best available X" pattern as bestPlaymakerSkill
    // above, but for overall talent rather than playmaking. Every other
    // balance term in this file (ratingVariance, impactPenalty, ...)
    // only checks TEAM AVERAGES, and an average can't tell "2 stars + 3
    // weak fillers" apart from "5 solid mid-tier players" if both happen
    // to average out the same — which is exactly how e.g. 2 of a pool's
    // best players can end up on the same team while every score term
    // reports a perfectly balanced split. Balancing THIS value instead
    // (see starClusterPenalty below) catches that regardless of team
    // averages, and — unlike a fixed-size "top N players are elite" set —
    // it naturally covers "2nd tier but still clearly strong" players
    // too, without needing an arbitrary cutoff.
    function topTalentStrength(team) {
      const sorted = team.slice().sort(function (a, b) { return computeCompositeRating(b) - computeCompositeRating(a); });
      return sorted.slice(0, Math.min(2, sorted.length)).reduce(function (s, p) { return s + computeCompositeRating(p); }, 0);
    }

    // Penalizes a split where one team has NO ONE (primary or secondary
    // role) covering a key role while the other team has at least one —
    // e.g. a team with zero playmakers, when the other team has two.
    function roleCoveragePenalty(teamA, teamB) {
      let penalty = 0;
      KEY_ROLES.forEach(function (role) {
        const aHas = teamA.some(function (p) { return playerRoles(p).indexOf(role) !== -1; });
        const bHas = teamB.some(function (p) { return playerRoles(p).indexOf(role) !== -1; });
        if (aHas !== bHas) penalty += 1.5;
      });
      return penalty;
    }

    // Shared by both Team Manager and League Draft: a team's best
    // available ball-handler (see isPlaymakingCapable) — used to spread
    // out strong playmaking talent rather than letting it cluster on one
    // team. Folds in impact, not just raw skill, so this reflects "a
    // decent PG with good impact" rather than just "someone tagged PG."
    function bestPlaymakerSkill(team) {
      const capable = team.filter(isPlaymakingCapable);
      if (capable.length === 0) return 0;
      return Math.max.apply(null, capable.map(function (p) { return (p.skillLevel || 5) + (p.impact || 0) * 2; }));
    }

    // Every way to choose 5 of the 10 players (252 total), used below to
    // evaluate every one of the 126 distinct team pairings.
    function choose5(players) {
      const results = [];
      const n = players.length;
      (function combo(start, chosen) {
        if (chosen.length === 5) { results.push(chosen.slice()); return; }
        for (let i = start; i < n; i++) {
          chosen.push(i);
          combo(i + 1, chosen);
          chosen.pop();
        }
      })(0, []);
      return results;
    }

    // Evaluates all 126 distinct splits and returns them sorted by score
    // (lowest/fairest first) — kept separate from assembleTeams() so the
    // "pick one" strategy (see below) can change independently of the
    // scoring itself.
    function evaluateAllSplits(players) {
      const allCombos = choose5(players);
      const seenKeys = new Set();
      const results = [];

      allCombos.forEach(function (idxA) {
        const key = idxA.join(',');
        const idxBSet = new Set(idxA);
        const idxB = [];
        for (let i = 0; i < players.length; i++) if (!idxBSet.has(i)) idxB.push(i);
        const complementKey = idxB.join(',');
        if (seenKeys.has(complementKey)) return; // already evaluated this pairing from the other side
        seenKeys.add(key);

        const teamA = idxA.map(function (i) { return players[i]; });
        const teamB = idxB.map(function (i) { return players[i]; });

        const ratingA = teamA.reduce(function (s, p) { return s + computeCompositeRating(p); }, 0);
        const ratingB = teamB.reduce(function (s, p) { return s + computeCompositeRating(p); }, 0);
        const ratingDiff = Math.abs(ratingA - ratingB);

        const bigsA = teamA.filter(function (p) { return isBigPosition(p.position); }).length;
        const bigsB = teamB.filter(function (p) { return isBigPosition(p.position); }).length;
        const positionPenalty = Math.abs(bigsA - bigsB) * 2;

        const heightA = teamA.reduce(function (s, p) { return s + (p.heightCm || 175); }, 0) / 5;
        const heightB = teamB.reduce(function (s, p) { return s + (p.heightCm || 175); }, 0) / 5;
        const heightPenalty = Math.abs(heightA - heightB) / 5;

        const rolePenalty = roleCoveragePenalty(teamA, teamB);

        // Same reasoning as League Draft: the aggregate rating alone
        // doesn't stop two high-impact players (or two strong
        // playmakers) from landing on the same team as long as other
        // stats happen to average out.
        // impact carries a higher weight here (x3, vs x1.5 for the other
        // variance-based penalties below) to match its doubled weight in
        // computeCompositeRating — it's judged the stat most likely to
        // change how a real game actually plays out.
        const impactA = teamA.reduce(function (s, p) { return s + (p.impact || 0); }, 0) / 5;
        const impactB = teamB.reduce(function (s, p) { return s + (p.impact || 0); }, 0) / 5;
        const impactPenalty = Math.abs(impactA - impactB) * 3;

        const playmakerA = bestPlaymakerSkill(teamA);
        const playmakerB = bestPlaymakerSkill(teamB);
        const playmakerPenalty = Math.abs(playmakerA - playmakerB) * 1.5;

        // Coverage gaps: a team left with zero Centers (or zero
        // rim-presence fallback) or zero playmaking-capable players when
        // there were enough to go around — see coverageGapPenalty above.
        const tallThreshold = averageBigHeight(players);
        const centerGapPenalty = coverageGapPenalty([teamA, teamB], function (p) { return p.position === 'C'; }, 6);
        const rimGapPenalty = coverageGapPenalty([teamA, teamB], function (p) { return hasRimPresence(p, tallThreshold); }, 4);
        const playmakerGapPenalty = coverageGapPenalty([teamA, teamB], isPlaymakingCapable, 6);

        // Star clustering: don't let 2 of the pool's best players land on
        // the same team just because the rest of the roster happens to
        // average out — see topTalentStrength above.
        const starPenalty = Math.abs(topTalentStrength(teamA) - topTalentStrength(teamB)) * 2;

        const score = ratingDiff + positionPenalty + heightPenalty + rolePenalty + impactPenalty + playmakerPenalty +
          centerGapPenalty + rimGapPenalty + playmakerGapPenalty + starPenalty;

        results.push({ teamA: teamA, teamB: teamB, ratingA: ratingA, ratingB: ratingB, score: score });
      });

      results.sort(function (a, b) { return a.score - b.score; });
      return results;
    }

    // Picking the single mathematically-best split every time means the
    // same 10 people always get split the same way. Instead, pick
    // randomly among the 10 fairest splits (out of 126 total — the top
    // ~8%) — every option is still close to optimal, but re-running this
    // on the same group gives real variety instead of a fixed result.
    function assembleTeams(players) {
      const allResults = evaluateAllSplits(players);
      const topK = allResults.slice(0, Math.min(10, allResults.length));
      return topK[Math.floor(Math.random() * topK.length)];
    }
    // SHARED-LOGIC:team-manager-algorithm:END

    function renderTeamCard(title, team, rating) {
      const avg = (rating / team.length).toFixed(1);
      const players = team.slice().sort(function (a, b) { return computeCompositeRating(b) - computeCompositeRating(a); });
      const rows = players.map(function (p) {
        return '' +
          '<div class="tm-team-player">' +
            '<span>' + esc(p.name) + '</span>' +
            '<span class="tm-team-player-pos">' + esc(p.position || '—') + '</span>' +
          '</div>';
      }).join('');
      return '' +
        '<div class="tm-team-card">' +
          '<div class="tm-team-title">' + esc(title) + '</div>' +
          '<div class="tm-team-rating">Total rating ' + rating.toFixed(1) + ' · avg ' + avg + '</div>' +
          rows +
        '</div>';
    }

    function renderTeamResults(result) {
      const box = document.getElementById('tmResults');
      if (!box) return;
      if (!result) { box.innerHTML = ''; return; }
      const diff = Math.abs(result.ratingA - result.ratingB).toFixed(1);
      box.innerHTML =
        '<div class="tm-fairness-note">Fairest of 126 possible splits · rating gap ' + diff + '</div>' +
        renderTeamCard('🏀 Team A', result.teamA, result.ratingA) +
        renderTeamCard('🏀 Team B', result.teamB, result.ratingB);
    }

    // ===================== League Draft =====================
    // Same attendance-parsing/matching as Team Manager (parseAttendanceNames,
    // matchAttendanceToProfiles are generic — reused as-is), but this
    // splits EVERYONE pasted in into N teams, not a hand-picked 10 into 2.

    // SHARED-LOGIC:league-draft-algorithm:START (generated from shared/draft-logic.js — do not edit here; run node scripts/sync-shared.js)
    function computeTeamSizes(total, numTeams) {
      const base = Math.floor(total / numTeams);
      const remainder = total % numTeams;
      const sizes = [];
      for (let i = 0; i < numTeams; i++) sizes.push(i < remainder ? base + 1 : base);
      return sizes;
    }

    function findMaxValidTeams(total) {
      let maxTeams = 1;
      for (let t = 1; t <= total; t++) {
        if (Math.floor(total / t) >= 5) maxTeams = t;
      }
      return maxTeams;
    }

    function validateTeamCount(total, numTeams) {
      if (!numTeams || numTeams < 1) {
        return { valid: false, message: 'Enter a valid number of teams.' };
      }
      const smallest = Math.floor(total / numTeams);
      if (smallest < 5) {
        const maxTeams = findMaxValidTeams(total);
        return {
          valid: false,
          message: total + ' players into ' + numTeams + ' teams would leave some teams with only ' +
            smallest + ' player' + (smallest === 1 ? '' : 's') + ' (minimum is 5). Try up to ' +
            maxTeams + ' team' + (maxTeams === 1 ? '' : 's') + ' instead.',
        };
      }
      return { valid: true };
    }

    // Serpentine draft order (1,2,3,4,4,3,2,1,1,2,3,...), skipping a team
    // once it's reached its (possibly smaller) capacity — this is what
    // makes uneven team sizes like 8/8/8/7 work correctly.
    function buildSnakeOrder(teamSizes) {
      const numTeams = teamSizes.length;
      const remaining = teamSizes.slice();
      const totalPlayers = teamSizes.reduce(function (a, b) { return a + b; }, 0);
      const order = [];
      let direction = 1;
      while (order.length < totalPlayers) {
        const seq = [];
        for (let i = 0; i < numTeams; i++) seq.push(direction === 1 ? i : numTeams - 1 - i);
        seq.forEach(function (teamIdx) {
          if (remaining[teamIdx] > 0) {
            order.push(teamIdx);
            remaining[teamIdx]--;
          }
        });
        direction *= -1;
      }
      return order.slice(0, totalPlayers);
    }

    function snakeDraftAssign(players, teamSizes) {
      const sorted = players.slice().sort(function (a, b) { return computeCompositeRating(b) - computeCompositeRating(a); });
      const order = buildSnakeOrder(teamSizes);
      const teams = teamSizes.map(function () { return []; });
      for (let i = 0; i < sorted.length; i++) teams[order[i]].push(sorted[i]);
      return teams;
    }

    function computeTeamAvgRating(team) {
      const total = team.reduce(function (s, p) { return s + computeCompositeRating(p); }, 0);
      return total / team.length;
    }

    // Extends the same position/role-coverage philosophy from Team
    // Manager's 2-team scoring to N teams: penalize uneven rating
    // averages, uneven "big man" distribution, uneven height, any
    // key role (Playmaker/Rebounder/Defender) that some teams have
    // covered and others don't, and — see below — a team left with zero
    // Centers or zero playmaking-capable players when the pool had
    // enough to cover every team.
    function computeMultiTeamScore(teams) {
      const avgs = teams.map(computeTeamAvgRating);
      const overallAvg = avgs.reduce(function (a, b) { return a + b; }, 0) / avgs.length;
      const ratingVariance = avgs.reduce(function (s, a) { return s + Math.pow(a - overallAvg, 2); }, 0);

      const bigsCounts = teams.map(function (team) {
        return team.filter(function (p) { return isBigPosition(p.position); }).length;
      });
      const avgBigs = bigsCounts.reduce(function (a, b) { return a + b; }, 0) / bigsCounts.length;
      const positionPenalty = bigsCounts.reduce(function (s, c) { return s + Math.abs(c - avgBigs); }, 0);

      let rolePenalty = 0;
      KEY_ROLES.forEach(function (role) {
        const coverage = teams.map(function (team) {
          return team.some(function (p) { return playerRoles(p).indexOf(role) !== -1; });
        });
        const covered = coverage.filter(Boolean).length;
        const uncovered = teams.length - covered;
        if (covered > 0 && uncovered > 0) rolePenalty += uncovered * 1.5;
      });

      const heightAvgs = teams.map(function (team) {
        return team.reduce(function (s, p) { return s + (p.heightCm || 175); }, 0) / team.length;
      });
      const overallHeightAvg = heightAvgs.reduce(function (a, b) { return a + b; }, 0) / heightAvgs.length;
      const heightPenalty = heightAvgs.reduce(function (s, h) { return s + Math.abs(h - overallHeightAvg); }, 0) / 5;

      // Impact balance: the overall composite rating already folds in
      // impact at double-weight (see computeCompositeRating), but that
      // alone doesn't stop two very high-impact players from landing on
      // the same team as long as their OTHER stats happen to average out
      // across the roster. Impact tends to swing real games more than
      // the aggregate number suggests, so it gets its own dedicated
      // balance check too, weighted up (x3 below, vs x1.5 for the other
      // variance penalties) to match.
      const impactAvgs = teams.map(function (team) {
        return team.reduce(function (s, p) { return s + (p.impact || 0); }, 0) / team.length;
      });
      const overallImpactAvg = impactAvgs.reduce(function (a, b) { return a + b; }, 0) / impactAvgs.length;
      const impactPenalty = impactAvgs.reduce(function (s, a) { return s + Math.pow(a - overallImpactAvg, 2); }, 0);

      // Playmaking balance: spreads out the strongest ball-handlers (PG
      // by position, or anyone with Playmaker as a role) instead of
      // letting one team monopolize the best playmaking talent — a
      // single strong point guard changes a game more than their raw
      // rating number alone implies.
      const bestPlaymakerSkills = teams.map(bestPlaymakerSkill);
      const overallPlaymakerAvg = bestPlaymakerSkills.reduce(function (a, b) { return a + b; }, 0) / bestPlaymakerSkills.length;
      const playmakerPenalty = bestPlaymakerSkills.reduce(function (s, v) { return s + Math.pow(v - overallPlaymakerAvg, 2); }, 0);

      // Coverage gaps: every team should have at least 1 Center if
      // there are enough Centers in the whole draft pool to give each
      // team one — falling back to a tall/Rebounder-tagged PF when there
      // aren't — and at least 1 playmaking-capable player (PG, or a
      // Playmaker-role player) so no team is left without anyone who can
      // run the offense. See coverageGapPenalty.
      const allPlayers = [].concat.apply([], teams);
      const tallThreshold = averageBigHeight(allPlayers);
      const centerGapPenalty = coverageGapPenalty(teams, function (p) { return p.position === 'C'; }, 6);
      const rimGapPenalty = coverageGapPenalty(teams, function (p) { return hasRimPresence(p, tallThreshold); }, 4);
      const playmakerGapPenalty = coverageGapPenalty(teams, isPlaymakingCapable, 6);

      // Star clustering: don't let 2+ of the pool's best players land on
      // the same team just because the rest of the roster happens to
      // average out — see topTalentStrength above.
      const topTalentValues = teams.map(topTalentStrength);
      const overallTopTalentAvg = topTalentValues.reduce(function (a, b) { return a + b; }, 0) / topTalentValues.length;
      const starPenalty = topTalentValues.reduce(function (s, v) { return s + Math.pow(v - overallTopTalentAvg, 2); }, 0);

      return ratingVariance + positionPenalty * 2 + rolePenalty + heightPenalty + impactPenalty * 3 + playmakerPenalty * 1.5 +
        centerGapPenalty + rimGapPenalty + playmakerGapPenalty + starPenalty * 2;
    }

    // Randomly swaps players between two teams, keeping the swap only if
    // it improves the overall score — a bounded local-search polish on
    // top of the snake draft's starting point. Brute-forcing every
    // possible N-way partition (unlike Team Manager's 126 fixed splits)
    // isn't remotely feasible once there are more than 2 teams.
    function localSearchImprove(teams, iterations) {
      let currentScore = computeMultiTeamScore(teams);
      const numTeams = teams.length;
      if (numTeams < 2) return { teams: teams, score: currentScore };

      for (let iter = 0; iter < iterations; iter++) {
        const teamA = Math.floor(Math.random() * numTeams);
        let teamB = Math.floor(Math.random() * numTeams);
        while (teamB === teamA) teamB = Math.floor(Math.random() * numTeams);
        const idxA = Math.floor(Math.random() * teams[teamA].length);
        const idxB = Math.floor(Math.random() * teams[teamB].length);

        const playerA = teams[teamA][idxA];
        const playerB = teams[teamB][idxB];
        teams[teamA][idxA] = playerB;
        teams[teamB][idxB] = playerA;

        const newScore = computeMultiTeamScore(teams);
        if (newScore < currentScore) {
          currentScore = newScore;
        } else {
          teams[teamA][idxA] = playerA;
          teams[teamB][idxB] = playerB;
        }
      }
      return { teams: teams, score: currentScore };
    }

    // Like Team Manager's "top 10 of 126, pick randomly" — but since we
    // can't enumerate every possible N-way partition, variety instead
    // comes from running the whole randomized local-search pipeline
    // several independent times and picking randomly among the best few
    // results, rather than always returning the single best attempt.
    function assembleLeagueTeams(players, numTeams) {
      const teamSizes = computeTeamSizes(players.length, numTeams);
      const attempts = [];
      const NUM_ATTEMPTS = 8;
      const ITERATIONS_PER_ATTEMPT = 400;
      for (let a = 0; a < NUM_ATTEMPTS; a++) {
        const initial = snakeDraftAssign(players, teamSizes);
        attempts.push(localSearchImprove(initial, ITERATIONS_PER_ATTEMPT));
      }
      attempts.sort(function (x, y) { return x.score - y.score; });
      const topPool = attempts.slice(0, Math.min(3, attempts.length));
      const choice = topPool[Math.floor(Math.random() * topPool.length)];
      return { teams: choice.teams, score: choice.score, teamSizes: teamSizes };
    }
    // SHARED-LOGIC:league-draft-algorithm:END

    function renderLeagueTeamCard(title, team) {
      const total = team.reduce(function (s, p) { return s + computeCompositeRating(p); }, 0);

    function getAdminToken() {
      try { return localStorage.getItem('hsAdminToken') || null; } catch (e) { return null; }

    function isAdmin() { return !!getAdminToken(); }
    function setAdminToken(token) {
      try { localStorage.setItem('hsAdminToken', token); } catch (e) { /* ignore */ }

    function setLoadingOverlay_(show, text) {
      if (text) document.getElementById('loadingOverlayText').textContent = text;
      document.getElementById('loadingOverlay').classList.toggle('show', show);
    }

    // Sent as text/plain, not application/json — a cross-origin JSON POST
    // triggers a CORS preflight (OPTIONS) that Apps Script web apps can't
    // answer, so text/plain (a CORS "simple request") is used instead; the
    // server reads the raw body regardless of the declared content type.
    // Shows the spinner overlay immediately (writes to the Leagues sheet
    // are slow enough that no feedback reads as "did my click even
    // register?") and leaves it up on success — the caller always follows
    // with a loadData() that keeps it visible through to fresh data, so
    // hiding it here first would just flicker. Only hides it on error,
    // since then nothing else will.
    function callLeagueApi_(action, payload) {
      setLoadingOverlay_(true, 'Saving…');
      const body = Object.assign({ action: action, adminToken: getAdminToken() }, payload);
      return fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body),
      })
        .then(function (r) { return r.json(); })
        .then(function (json) {
          if (!json.ok) throw new Error(json.error || 'Request failed.');
          return json.result;
        })
        .catch(function (err) {
          setLoadingOverlay_(false);
          throw err;
        });
    }

    // Deliberately a plain text field, not <input type="date"> — a native
    // date input's displayed format follows the viewer's browser/OS
    // locale (mm/dd/yyyy, dd/mm/yyyy, etc.) with no way to force one
    // consistently from the page, so dd/mm/yyyy is enforced here instead.
    function isValidDMY_(s) {
      const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);
      if (!m) return false;
      const day = parseInt(m[1], 10), month = parseInt(m[2], 10), year = parseInt(m[3], 10);
      if (month < 1 || month > 12) return false;
      const daysInMonth = new Date(year, month, 0).getDate();
      return day >= 1 && day <= daysInMonth;
    }

        '<div class="il-form-grid" data-league="' + esc(league.leagueId) + '">' +

          '<button class="export-btn il-cancel-add-game-btn" type="button">Cancel</button>' +
